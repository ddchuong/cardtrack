  return w;
}

// Lưu giao dịch (tách riêng để confirm-sheet gọi lại được sau khi user đồng ý)
// `amt` LUÔN dương (ô nhập không cho số âm) — dấu hoàn tiền áp ở đây theo _txaRefund.
function _saveTxn(amt,outOfCycle){
  const signedAmt=_txaRefund?-Math.abs(amt):Math.abs(amt);
  const fx=txaBuildFx();
  const wasRefund=_txaRefund;
  if(state.editTxnId){
    const tx=state.transactions.find(t=>t.id===state.editTxnId)||(state.txnArchive||[]).find(t=>t.id===state.editTxnId);
    if(tx){
      tx.cardId=state.addCardId;tx.shop=state.addShop.trim();tx.amount=signedAmt;tx.category=state.addCategory;tx.date=state.addDate;
      if(fx)tx.fx=fx;else delete tx.fx;
    }
    state.editTxnId=null;state.addShop="";state.addAmount="";
    txaResetForm();
    persist();buzz(18);
    showToast(outOfCycle?"✓ Đã lưu — GD nằm ở Lịch sử":"✓ Đã lưu thay đổi");render();return;
  }
  const newTx={id:newTxnId(),cardId:state.addCardId,shop:state.addShop.trim(),amount:signedAmt,category:state.addCategory,date:state.addDate};
  if(fx)newTx.fx=fx;
  state.transactions.unshift(newTx);
  state.addShop="";state.addAmount="";
  txaResetForm();
  persist();buzz(18);
  showToast(outOfCycle?`✓ Đã lưu ${money(amt)} — nằm ở Lịch sử`:(wasRefund?`✓ Đã ghi hoàn tiền ${money(amt)}`:`✓ Đã thêm ${money(amt)}`));
  render();
}

function tx2Row(tx,showCard,isLive,showDateInline){
  const card=ALL_CARDS.find(c=>c.id===tx.cardId);
  const ct=card?txCycleTxns(card,tx):[];
  const cb=card?calcTxnCb(tx,card,ct):0;
  const open=isLive&&tx2OpenId===tx.id;
  const refund=isRefund(tx);
  const derived=isDerived(tx);
  const wrap=h("div",{className:"tx2-hrow"});
  const shopBlock=h("div",{style:{flex:"1",minWidth:0}},
    h("div",{className:"tx-shop"},tx.shop||"(không tên)"),
    h("div",{className:"tx-meta"},
      showCard?h("span",{className:"tx-tag",style:{background:card?card.color+"1a":"var(--bg3)",color:"var(--text2)"}},card?"••"+(card.last4||(card.cardNum||"").slice(-4)):"?"):null,

      !isLive?h("span",{className:"badge badge-muted"},"📦 Lưu trữ"):null));
  if(tx.fx&&tx.fx.cur&&card){
    const fee=txnFxFee(tx,card);
    shopBlock.appendChild(h("div",{className:"txa-fx-line txa-fx-sub"},
      "🌏 ",txaMono(`${txaFmtOrig(tx.fx.orig)}${NBSP}${tx.fx.cur}`)," · phí FX ≈ ",txaMono(fmtK(fee))));
    const net=txnNetCost(tx,card,ct).net;
    if(Math.round(net)!==Math.round(tx.amount))
      shopBlock.appendChild(h("div",{className:"txa-fx-line txa-fx-sub"},"thực tế ≈ ",txaMono(money(Math.abs(net)))));
  }
  const cbText=cb!==0?(cb>0?"+":"− ")+fmtK(Math.abs(cb)):null;
  wrap.appendChild(h("div",{className:"tx-row",style:{borderBottom:"1px solid var(--border)"}},
    showCard?h("span",{className:"net-sm",style:{background:card?card.color:"#666"}},card?(NET_ICONS[card.network]||"?"):"?"):null,
    shopBlock,
    h("div",{className:"tx-right"},
      h("div",{className:"tx-amount",style:{color:refund?"var(--warn)":""}},(refund?"− ":"")+fmt(Math.abs(tx.amount))+NBSP+"₫"),
      cbText?h("div",{className:"tx-cb",style:{color:cb<0?"var(--warn)":"var(--green)"}},cbText):null),
    isLive?h("button",{className:"tx2-more","aria-label":"Thao tác với giao dịch "+(tx.shop||""),onClick:()=>{tx2OpenId=open?null:tx.id;render()}},"⋯"):null));
  if(open)wrap.appendChild(tx2ActionRow(tx));
  return wrap;
}

/* ── Kỳ trả góp sắp tới (≤7 ngày) → gộp vào nhóm "Tuần này" cùng event khác ──
   materializeDue() đã sinh giao dịch cho mọi kỳ date<=hôm nay, nên ở đây chỉ còn kỳ TƯƠNG LAI. */
function alUpcomingInsEvents(){
  const ids=new Set(state.selectedCardIds),today=toLocalDateStr(new Date()),now=new Date(),out=[];
  (state.installments||[]).forEach(ins=>{
    if(!ids.has(ins.cardId))return;
    const card=ALL_CARDS.find(c=>c.id===ins.cardId);if(!card)return;
    insSchedule(ins).forEach(k=>{
      if(k.date<=today)return;
      const diff=Math.ceil((parseLocalDate(k.date)-now)/864e5);
      if(diff<0||diff>7)return;
      out.push({id:"insev-"+ins.id+"-"+k.no,isAuto:true,date:k.date,diff,
        title:`Trả góp ${ins.shop||"—"} · kỳ ${k.no}/${ins.months}`,
        sub:`${card.name} ${card.cardNum||"****"+card.last4} · ${fmt(k.amount)}${NBSP}₫`,
        cardId:card.id,cardColor:card.color});
    });
  });
  return out;
}

function alStmtRow(c,o){
  const warnDue=o.days!=null&&o.days<=3;
  const dueStr=o.due?`${o.due.getDate()}/${o.due.getMonth()+1}`:"—";
  const daysStr=o.days==null?"":o.days===0?"HÔM NAY":`còn ${o.days}d`;
  const draft=alDraft["pay-"+c.id];
  return h("div",{className:"al-stmt-card",style:{borderLeftColor:c.color}},
    h("div",{className:"al-stmt-head"},
      h("span",{className:"net-sm",style:{background:c.color}},NET_ICONS[c.network]),
      h("span",{className:"al-stmt-name"},`${c.name} ${c.cardNum||"****"+c.last4}`)),
    h("div",{className:"stat-row"},
      h("div",{className:"stat-box"},h("div",{className:"stat-label"},"Phải trả"),
        h("div",{className:"stat-val",style:{fontFamily:"var(--font-mono)",color:"var(--warn)"}},money(o.left))),
      h("div",{className:"stat-box"},h("div",{className:"stat-label"},"Tối thiểu"),
        h("div",{className:"stat-val",style:{fontFamily:"var(--font-mono)",fontSize:"14px"}},o.min?money(o.min):"—")),
      h("div",{className:"stat-box"},h("div",{className:"stat-label"},"Hạn TT"),
        h("div",{className:"stat-val",style:{fontFamily:"var(--font-mono)",fontSize:"14px",color:warnDue?"var(--warn)":"var(--text)"}},dueStr),
        daysStr?h("div",{style:{fontFamily:"var(--font-mono)",fontSize:"12px",fontWeight:700,marginTop:"2px",color:warnDue?"var(--warn)":"var(--text3)"}},daysStr):null)),
    h("div",{className:"al-pay-row"},
      h("input",{className:"input al-pay-inp",type:"text",inputmode:"numeric",placeholder:"Đã trả một phần?",
        "data-fid":"al-pay-"+c.id,value:draft==null?"":draft,
        onInput:e=>alSetDraft("pay-"+c.id,e.target.value)}),
      h("button",{className:"al-pay-save",onClick:()=>{
        const amt=parseAmount(draft||"");
        if(!amt){showToast("Nhập số tiền đã trả");return}
        buzz(8);setStmt(c.id,o.key,{paid:(o.paid||0)+amt});alClearDraft("pay-"+c.id);showToast("✓ Đã ghi nhận thanh toán");render();
      }},"Lưu")),
    h("button",{className:"al-pay-full",onClick:()=>{buzz(10);setStmt(c.id,o.key,{paid:o.stmt});showToast("✓ Đã trả đủ");render()}},"✓ Đã trả đủ"));
}
function alQuickStmtForm(c){
  const cyc=recentCycles(c,2)[1];
  const ds=alDraft["s-"+c.id],dm=alDraft["m-"+c.id];
  return h("div",{className:"al-qform"},
    h("div",{className:"al-qform-name"},`${c.name} ${c.cardNum||"****"+c.last4} · kỳ ${cyc.label}`),
    h("div",{className:"al-qform-row"},
      h("input",{className:"input",type:"text",inputmode:"numeric",placeholder:"Số dư sao kê",
        "data-fid":"al-qs-"+c.id,value:ds==null?"":ds,onInput:e=>alSetDraft("s-"+c.id,e.target.value)}),
      h("input",{className:"input",type:"text",inputmode:"numeric",placeholder:"Trả tối thiểu",
        "data-fid":"al-qm-"+c.id,value:dm==null?"":dm,onInput:e=>alSetDraft("m-"+c.id,e.target.value)})),
    h("button",{className:"al-qform-save",onClick:()=>{
      const stmt=parseAmount(ds||""),min=parseAmount(dm||"");
      if(!stmt){showToast("Nhập số dư sao kê");return}
      buzz(8);setStmt(c.id,cyc.key,{stmt,min:min||null});alClearDraft("s-"+c.id,"m-"+c.id);
      showToast("✓ Đã lưu sao kê");render();
    }},"Lưu sao kê"));
}
function renderAlertsTab(){
  const w=h("div",null);
  const ids=new Set(state.selectedCardIds);
  const insList=(state.installments||[]).filter(i=>ids.has(i.cardId));
  const recList=(state.recurring||[]).filter(r=>ids.has(r.cardId));
  const all=allEvents().concat(alUpcomingInsEvents()).sort((a,b)=>a.date.localeCompare(b.date));
  const pend=pendingCalEvents();
  const cards=selectedCards();
  const outList=cards.map(c=>({c,o:outstandingOf(c)})).filter(x=>x.o);
  const owedList=outList.filter(x=>x.o.left>0).sort((a,b)=>(a.o.days??999)-(b.o.days??999));
  const totalOwed=owedList.reduce((s,x)=>s+x.o.left,0);
  const afList=ALL_CARDS.filter(c=>c.afNext).map(c=>({c,d:afNextDate(c)})).filter(x=>x.d).sort((a,b)=>a.d-b.d);
  const afSoonList=afList.filter(x=>afSoon(x.c));
  const afOtherList=afList.filter(x=>!afSoon(x.c));
  const afSoonTotal=afSoonList.reduce((s,x)=>s+(x.c.annualFee||0),0);
  const urgN=urgentCount()+owedList.filter(x=>x.o.days!=null&&x.o.days<=3).length;
  const insOutT=insOutstanding(),recMonT=recMonthlyTotal();

  if(!all.length&&!owedList.length&&!afSoonList.length&&!insList.length&&!recList.length){
    w.appendChild(h("div",{className:"es"},
      h("div",{className:"es-ic"},"🎉"),
      h("div",{className:"es-t"},"Không có gì cần nhắc"),
      h("div",{className:"es-s"},"Mọi sao kê đã ổn, không có PTN nào sắp charge — cứ yên tâm chi tiêu")));
    w.appendChild(h("div",{className:"ev-section"},"🛍️ Trả góp"));
    w.appendChild(alInsSection(cards,insList));
    w.appendChild(h("div",{className:"ev-section"},"🔁 Chi tiêu định kỳ"));
    w.appendChild(alRecSection(cards,recList));
    return w;
  }

  // ── Số lớn nhất của màn này: TỔNG TIỀN PHẢI TRẢ (dư nợ sao kê gần nhất) ──
  // Trả góp/định kỳ là nghĩa vụ khác thời điểm — KHÔNG cộng vào số này, chỉ ghi thêm ở footer.
  const heroFoot=h("div",{className:"hero-foot"},
    h("span",null,h("b",null,owedList.length)," thẻ còn dư nợ"),
    afSoonTotal>0?h("span",null,"PTN sắp charge ",h("b",null,money(afSoonTotal))):h("span",null,"Không có PTN sắp tới"));
  w.appendChild(h("div",{className:"hero"},
    h("div",{className:"hero-lbl"},"Tổng phải trả"),
    h("div",{className:"hero-num",style:{color:totalOwed>0?"var(--warn)":"var(--green)"}},fmt(totalOwed)+NBSP+"₫"),
    urgN>0?h("div",{className:"hero-pot",style:{color:"var(--warn)"}},`⚡ ${urgN} nhắc gấp trong 3 ngày tới`)
          :h("div",{className:"hero-pot",style:{color:"var(--green)"}},"✓ không có nhắc gấp nào"),
    heroFoot,
    (insOutT>0||recMonT>0)?h("div",{className:"al-hero-more"},
      h("span",null,"Trả góp còn ",h("b",null,money(insOutT))),
      h("span",null,"Định kỳ ",h("b",null,money(recMonT)),"/tháng")):null));

  // ── Thêm vào Lịch iPhone ──
  w.appendChild(h("div",{className:"ics-bar"},
    h("button",{className:"ics-btn",onClick:()=>{buzz(10);openCalPicker()}},`📅 Thêm vào Lịch iPhone${pend.length?` (${pend.length} chờ)`:""}`),
    h("div",{className:"ics-hint"},pend.length?`${pend.length} event chưa thêm · chọn → xuất .ics → mở bằng Safari để "Add"`:"✓ Mọi event hiện có đã được thêm vào Lịch")));
  if(state.calPicker)w.appendChild(renderCalPicker());

  // ── Hôm nay / Tuần này / Sắp tới — chỉ event gần nhất nhấp nháy ──
  // (kỳ trả góp trong 7 ngày tới đã được gộp vào `all` ở trên, rơi đúng vào "Tuần này")
  const groups=[
    {label:"🔴 Hôm nay",test:e=>e.diff===0},
    {label:"📅 Tuần này",test:e=>e.diff>=1&&e.diff<=7},
    {label:"🗓️ Sắp tới",test:e=>e.diff>=8},
  ];
  let nextAssigned=false;
  groups.forEach(g=>{
    const list=all.filter(g.test);
    if(!list.length)return;
    w.appendChild(h("div",{className:"ev-section"},g.label));
    list.forEach(e=>{
      const urg=e.diff<=3,isNext=!nextAssigned;if(!nextAssigned)nextAssigned=true;
      w.appendChild(renderEvCard(e,urg,isNext));
    });
  });

  // ── Thanh toán sao kê ──
  w.appendChild(h("div",{className:"ev-section"},"💳 Thanh toán sao kê"));
  if(!cards.length){
    w.appendChild(h("p",{className:"hint"},"// chưa theo dõi thẻ nào — vào phần Chọn thẻ để bắt đầu"));
  }else if(owedList.length){
    owedList.forEach(x=>w.appendChild(alStmtRow(x.c,x.o)));
  }else if(outList.length){
    w.appendChild(h("div",{className:"al-settled"},"✓ Đã thanh toán đủ mọi sao kê đang theo dõi"));
  }else{
    w.appendChild(h("div",{className:"al-hint-row"},
      h("div",{className:"al-hint-txt"},"Chưa nhập sao kê nào — nhập để bắt đầu theo dõi dư nợ từng kỳ"),
      h("button",{className:"al-hint-btn",onClick:()=>{alStmtOpen=!alStmtOpen;render()}},alStmtOpen?"Ẩn":"+ Nhập")));
    if(alStmtOpen)cards.slice(0,8).forEach(c=>w.appendChild(alQuickStmtForm(c)));
  }

  // ── Phí thường niên ──
  w.appendChild(h("div",{className:"ev-section"},"🎫 Phí thường niên"));
  if(afSoonList.length){
    afSoonList.forEach(x=>w.appendChild(renderPTNCard(x.c,x.d,true)));
  }else{
    w.appendChild(h("p",{className:"hint"},"// không có thẻ nào sắp đến hạn PTN (≤3 tháng)"));
  }
  if(afOtherList.length){
    w.appendChild(h("button",{className:"row-btn al-af-toggle",onClick:()=>{alAfOpen=!alAfOpen;render()}},
      h("span",null,alAfOpen?"▾ Ẩn danh sách":"▸ Xem các thẻ còn lại"),
      h("span",{className:"badge badge-muted"},afOtherList.length+" thẻ khác")));
    if(alAfOpen){
      const box=h("div",{className:"al-af-expand"});
      afOtherList.forEach(x=>box.appendChild(renderPTNCard(x.c,x.d,false)));
      w.appendChild(box);
    }
  }

  // ── Trả góp 0% (4.5) ──
  w.appendChild(h("div",{className:"ev-section"},"🛍️ Trả góp"));
  w.appendChild(alInsSection(cards,insList));

  // ── Chi tiêu định kỳ (4.8) ──
  w.appendChild(h("div",{className:"ev-section"},"🔁 Chi tiêu định kỳ"));
  w.appendChild(alRecSection(cards,recList));

  return w;
}
/*@ENDFRAG:schedule*/

//@FRAG-MOUNT

// ═══ INIT ═══
render();
</script>
</body>
