// Ghi lịch sử theo kỳ. Ghi ĐÈ khi bản mới đầy đủ hơn (count lớn hơn) — trước đây
// first-write-wins nên một kỳ bị purge từng phần sẽ bị báo thiếu vĩnh viễn.
// Giao dịch của thẻ không còn trong ALL_CARDS cũng được lưu (trước đây bị xoá trắng).
function archiveCycles(txns){
  state.history=state.history||[];
  const groups={};
  txns.forEach(tx=>{
    const c=ALL_CARDS.find(x=>x.id===tx.cardId);
    const cs=c?toLocalDateStr(cycleStart(c,parseLocalDate(tx.date))):tx.date.slice(0,7)+"-01";
    const key=tx.cardId+"|"+cs;
    (groups[key]=groups[key]||{card:c,cardId:tx.cardId,cs,txns:[]}).txns.push(tx);
  });
  Object.entries(groups).forEach(([id,g])=>{
    const row={id,cardId:g.cardId,cardName:g.card?g.card.name:g.cardId,last4:g.card?g.card.last4:"????",
      color:g.card?g.card.color:"#888",orphan:!g.card,
      cycleStart:g.cs,month:g.cs.slice(0,7),
      spend:g.txns.reduce((s,t)=>s+t.amount,0),
      cb:g.card?calcTotalCb(g.card,g.txns):0,count:g.txns.length};
    const i=state.history.findIndex(x=>x.id===id);
    if(i<0)state.history.push(row);
    else if((state.history[i].count||0)<row.count)state.history[i]=row; // bản đầy đủ hơn thắng
  });
  if(state.history.length>600)state.history=state.history.slice(-600);
}
// Lưu giao dịch đã rời khỏi kỳ hiện tại sang kho lưu trữ (giữ ARCHIVE_KEEP kỳ gần nhất)
// thay vì xoá trắng. Tab Thẻ/GD vẫn chỉ nhìn kỳ hiện tại như yêu cầu ban đầu.
const ARCHIVE_MONTHS=24;
function archiveMonthKey(tx){return String(tx.date||"").slice(0,7)}
function pushArchive(txns){
  if(!txns.length)return;
  state.txnArchive=state.txnArchive||[];
  const seen=new Set(state.txnArchive.map(t=>t.id));
  const merged=state.txnArchive.concat(txns.filter(t=>!seen.has(t.id)));
  const cutoff=(()=>{const d=new Date();d.setMonth(d.getMonth()-ARCHIVE_MONTHS);return toLocalDateStr(d).slice(0,7)})();
  state.txnArchive=merged.filter(t=>archiveMonthKey(t)>=cutoff).sort((a,b)=>a.date<b.date?-1:1);
}
function purgeOldTxns(){
  const now=new Date(),keep=[],drop=[];
  state.transactions.forEach(tx=>{
    const c=ALL_CARDS.find(c=>c.id===tx.cardId);
    if(!c){drop.push(tx);return}
    (parseLocalDate(tx.date)>=cycleStart(c,now)?keep:drop).push(tx);
  });
  // Prune paid-due markers whose date has passed (bỏ qua marker VIB dạng cardId|vibq|date)
  const pd=(state.paidDues||[]).filter(k=>{const p=k.split("|");const d=p[p.length-1];
    return !/^\d{4}-\d{2}-\d{2}$/.test(d)?true:d>=toLocalDateStr(now)});
  const pdChanged=pd.length!==(state.paidDues||[]).length;state.paidDues=pd;
  if(drop.length){archiveCycles(drop);pushArchive(drop);state.transactions=keep}
  if(drop.length||pdChanged)persist();
}
// Toàn bộ giao dịch đã biết (kỳ hiện tại + kho lưu trữ) — dùng cho tab GD, CSV, đối chiếu
function allTxns(){return state.transactions.concat(state.txnArchive||[])}
function selectedCards(){return ALL_CARDS.filter(c=>state.selectedCardIds.includes(c.id))}
// Giao dịch thuộc kỳ đang xét: cs <= date <= cycleEnd.
// Trước đây chỉ có chặn dưới nên giao dịch ghi ngày tương lai ăn cap của cả kỳ này lẫn kỳ sau.
function getCycleTxns(card,ref){
  const cs=cycleStart(card,ref),ce=cycleEndOf(card,cs);
  return state.transactions.filter(tx=>{
    if(tx.cardId!==card.id)return false;
    const d=parseLocalDate(tx.date);
    return d>=cs&&d<=ce;
  });
}
// Kỳ mà một giao dịch cụ thể thuộc về (để tính CB đúng cho giao dịch của tháng cũ)
function txCycleTxns(card,tx){
  const ref=parseLocalDate(tx.date),cs=cycleStart(card,ref),ce=cycleEndOf(card,cs);
  return allTxns().filter(t=>{
    if(t.cardId!==card.id)return false;
    const d=parseLocalDate(t.date);
    return d>=cs&&d<=ce;
  });
}
function getAutoEvents(){
  const now=new Date(),evts=[];
  state.selectedCardIds.forEach(id=>{
    const c=ALL_CARDS.find(x=>x.id===id);if(!c)return;
    if(!cardEvtOn(id))return; // reminders turned off for this card
    // VIB MAX: nhắc GỘP (PTN + đổi hạng HV) đặt 21 ngày TRƯỚC ngày đến hạn quý
    if(c.memberTiers){const ts=afNextDate(c);if(ts){
      const rem=new Date(ts.getFullYear(),ts.getMonth(),ts.getDate()-21); // 21 ngày trước
      const td=Math.ceil((rem-now)/864e5),tkey=c.id+"|vibq|"+toLocalDateStr(ts);
      if(td>=0&&td<=14&&!(state.paidDues||[]).includes(tkey))
        evts.push({id:"vibq-"+c.id,isAuto:true,dueKey:tkey,date:toLocalDateStr(rem),
          title:`PTN + đổi hạng HV: ${c.name} ${c.cardNum||"****"+c.last4}`,
          sub:`Trước ngày charge ${ts.getDate()}/${ts.getMonth()+1} — đóng PTN${c.annualFee?" ~"+fmtK(c.annualFee):""} & chọn lại hạng ở tab Thẻ`,
          cardId:c.id,cardColor:c.color,diff:td});}}
    const due=nextDueDate(c);if(!due)return;
    const diff=daysUntilDue(c),dueKey=c.id+"|"+toLocalDateStr(due);
    if((state.paidDues||[]).includes(dueKey))return;
    if(diff>=0&&diff<=14)evts.push({id:"auto-"+c.id,isAuto:true,dueKey,date:toLocalDateStr(due),title:`Đến hạn: ${c.name} ${c.cardNum||"****"+c.last4}`,sub:`Thanh toán trước ${due.getDate()}/${due.getMonth()+1}`,cardId:c.id,cardColor:c.color,diff});
  });return evts;
}
function urgentCount(){const now=new Date();return[...getAutoEvents(),...state.events.map(e=>({...e,diff:Math.ceil((parseLocalDate(e.date)-now)/864e5)}))].filter(e=>e.diff>=0&&e.diff<=3).length}
// Light haptic feedback on iPhone (no-op where unsupported)
function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch{}}
let _lastDeleted=null,_toastTimer=null;
function showToast(msg){const t=document.getElementById("toast");t.classList.remove("undo");t.textContent=msg;t.classList.add("show");clearTimeout(_toastTimer);_toastTimer=setTimeout(()=>t.classList.remove("show"),2000)}
function showToastUndo(msg,onUndo){
  const t=document.getElementById("toast");t.classList.add("undo");t.textContent="";
  t.appendChild(document.createTextNode(msg));
  t.appendChild(h("button",{className:"toast-undo",onClick:()=>{t.classList.remove("show");onUndo()}},"↶ Hoàn tác"));
  t.classList.add("show");clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>{t.classList.remove("show");_lastDeleted=null},4500);
}
// Delete a transaction with a 4.5s undo window
function deleteTxn(id){
  const idx=state.transactions.findIndex(t=>t.id===id);if(idx<0)return;
  _lastDeleted={tx:state.transactions[idx],idx};
  state.transactions.splice(idx,1);persist();buzz(12);render();
  showToastUndo("✓ Đã xoá giao dịch",()=>{
    if(!_lastDeleted)return;
    state.transactions.splice(Math.min(_lastDeleted.idx,state.transactions.length),0,_lastDeleted.tx);
    _lastDeleted=null;persist();buzz(8);render();showToast("↶ Đã hoàn tác");
  });
}
// Load a transaction into the Add form for editing
// Xoá nhắc CÓ hoàn tác (trước đây xoá thẳng, không confirm, không undo)
function deleteEvent(id){
  const i=state.events.findIndex(e=>e.id===id);if(i<0)return;
  const ev=state.events[i];buzz(10);
  state.events=state.events.filter(e=>e.id!==id);
  state.calAdded=(state.calAdded||[]).filter(k=>k!==id);
  persist();render();
  showToastUndo("✓ Đã xoá nhắc",()=>{state.events.splice(i,0,ev);persist();render()});
}
function editTxn(id){const tx=state.transactions.find(t=>t.id===id);if(!tx)return;buzz(6);
  setState({tab:"add",addMode:"txn",detailCardId:null,editTxnId:id,addCardId:tx.cardId,addCategory:tx.category,addShop:tx.shop,addAmount:String(tx.amount),addDate:tx.date});}
// Duplicate a transaction with today's date (for recurring spends)
function dupTxn(id){const tx=state.transactions.find(t=>t.id===id);if(!tx)return;
  state.transactions.unshift({id:newTxnId(),cardId:tx.cardId,shop:tx.shop,amount:tx.amount,category:tx.category,date:toLocalDateStr(new Date())});
  persist();buzz(12);showToast(`✓ Nhân bản ${fmtK(tx.amount)}₫ (hôm nay)`);render();}

// ═══ RENDER ENGINE ═══
function h(tag,attrs,...ch){
  const el=document.createElement(tag);let dv;
  if(attrs)for(const[k,v]of Object.entries(attrs)){
    if(k==="style"&&typeof v==="object")Object.assign(el.style,v);
    else if(k.startsWith("on"))el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="className")el.className=v;
    else if(k==="value")dv=v;
    else el.setAttribute(k,v);
  }
  for(const c of ch.flat()){if(c==null||c===false)continue;el.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(String(c)):c)}
  if(dv!==undefined)el.value=dv;return el;
}

function render(){
  purgeOldTxns();
  if(state.onboarded)materializeDue();
  // Save focus & cursor position
  const ae=document.activeElement;
  const focusId=ae?.dataset?.fid||"";
  const cursorPos=ae?.selectionStart??-1;
  const old=document.querySelector(".content"),st=old?old.scrollTop:0;
  const app=document.getElementById("app");app.innerHTML="";
  app.appendChild(renderHeader());
  // Only play the entrance animation when the actual view changes (tab / detail /
  // add-mode) — not on every in-view state update, which previously caused flicker.
  const viewSig=state.tab+"|"+(state.detailCardId||"")+"|"+(state.addMode||"")+"|"+(state.ptnCardId||"");
  const content=h("div",{className:"content"+(viewSig!==_lastView?" anim":"")});
  _lastView=viewSig;
  if(!state.onboarded){
    content.appendChild(renderOnboarding());
    app.appendChild(content);content.scrollTop=st;return;
  }
  if(showCalBanner())content.appendChild(renderCalBanner());
  switch(state.tab){
    case"home":content.appendChild(state.detailCardId?renderCardDetail():renderHomeTab());break;
    case"advice":content.appendChild(renderAdviceTab());break;
    case"txns":content.appendChild(renderTxnTab());break;
    case"alerts":content.appendChild(state.ptnCardId?renderPTNDetail(ALL_CARDS.find(c=>c.id===state.ptnCardId)):renderAlertsTab());break;
    case"add":content.appendChild(renderAddTab());break;
    default:state.tab="home";content.appendChild(renderHomeTab());
  }
  app.appendChild(content);
  if(state.tab!=="add")app.appendChild(renderFab());
  app.appendChild(renderTabBar());content.scrollTop=st;
  if(state.sheet)renderSheet(app);
  // Restore focus
  if(focusId){const el=document.querySelector(`[data-fid="${focusId}"]`);if(el){el.focus();if(cursorPos>=0&&el.setSelectionRange)try{el.setSelectionRange(cursorPos,cursorPos)}catch{}}}
}

function bankKeyOf(card){
  const id=card.id;
  if(id.startsWith("bidv"))return"BIDV";
  if(id.startsWith("shb"))return"SHB";
  if(id.startsWith("cimb"))return"CIMB";
  if(id.startsWith("hdb"))return"HDBank";

  if(id.startsWith("lpb"))return"LPBank";
  if(id.startsWith("mb"))return"MB Bank";
  if(id.startsWith("msb"))return"MSB";

// Ranking score for a card under a shop category: higher = better to use now.
// Active + min-spend met & most remaining CB rank first; full→0, inactive→-1.
function shopRemCb(cid,category){
  const card=ALL_CARDS.find(c=>c.id===cid);if(!card)return -1;
  const cb=card.cashbackCategories.find(c=>c.category===category);if(!cb)return -1;
  const ct=getCycleTxns(card),active=isCatActive(card,ct,category);
  if(!active)return -1;
  let rem=Math.max(effMaxCb(card,ct,cb)-calcCatCbRaw(card,ct,category),0);
  const shared=calcSharedCb(card,ct,true);
  if(shared&&shared.cats&&shared.cats.includes(category))rem=Math.min(rem,Math.max(shared.max-shared.total,0));
  const minMet=!(card.minSpend>0&&ct.reduce((s,t)=>s+t.amount,0)<card.minSpend);
  return minMet?rem:rem*0.001;
}
// Is this card worth using right now for the category? active + min met + CB remaining.
function shopUsable(cid,category){
  const card=ALL_CARDS.find(c=>c.id===cid);if(!card)return false;
  const cb=card.cashbackCategories.find(c=>c.category===category);if(!cb)return false;
  const ct=getCycleTxns(card),active=isCatActive(card,ct,category);
  if(!active)return false;
  const minMet=!(card.minSpend>0&&ct.reduce((a,t)=>a+t.amount,0)<card.minSpend);
  let rem=Math.max(effMaxCb(card,ct,cb)-calcCatCbRaw(card,ct,category),0);
  const sh=calcSharedCb(card,ct,true);
  if(sh&&sh.cats&&sh.cats.includes(category))rem=Math.min(rem,Math.max(sh.max-sh.total,0));
  return minMet&&rem>0;
}
// One card row under a shop. isSel=true → highlighted (your card), tap → log GD; false → muted, tap → select.
function renderShopRec(cid,category,isSel,isBest,shopName){
  const card=ALL_CARDS.find(c=>c.id===cid);if(!card)return null;
  const cb=card.cashbackCategories.find(c=>c.category===category);if(!cb)return null;
  const ct=getCycleTxns(card),active=isCatActive(card,ct,category),cs=calcCatSpend(card,ct,category);
  const er=effRate(card,ct,cb),emc=effMaxCb(card,ct,cb),ems=effMaxSpend(card,ct,cb);
  const pct=active?Math.min(cs/ems*100,100):0;
  const remS=active?Math.max(ems-cs,0):0;
  let remCb=active?Math.max(emc-calcCatCbRaw(card,ct,category),0):0;
  let isFull=!active||(active&&pct>=100);
  const shared=calcSharedCb(card,ct,true);
  if(active&&shared&&shared.cats&&shared.cats.includes(category)){remCb=Math.min(remCb,Math.max(shared.max-shared.total,0));if(shared.isFull)isFull=true}
  const inNote=(!active&&card.firstCatOnly)?getActiveCat(card,ct):null;
  const minNotMet=card.minSpend>0&&ct.reduce((a,t)=>a+t.amount,0)<card.minSpend;
  const sty=isSel
    ?{borderColor:isBest?"var(--accent)":(isFull?"var(--warnBorder)":`${card.color}40`),background:isFull?"var(--warnBg)":`color-mix(in srgb,${card.color} 4%,var(--bg3))`,boxShadow:isBest?`inset 3px 0 0 0 ${card.color},0 0 0 1.5px var(--accentBorder)`:`inset 3px 0 0 0 ${card.color}`,opacity:(active&&!minNotMet)?1:.72,cursor:"pointer"}
    :{borderColor:`${card.color}33`};
  return h("div",{className:"shop-rec"+(isSel?"":" unsel"),style:sty,
      onClick:isSel
        ?()=>{if(typeof buzz==="function")buzz();setState({tab:"add",addMode:"txn",editTxnId:null,detailCardId:null,addCardId:cid,addCategory:category,addShop:shopName||"",addAmount:""})}
        :()=>{if(typeof buzz==="function")buzz();setState({selectedCardIds:[...state.selectedCardIds,cid]})}},
    h("div",{style:{display:"flex",alignItems:"center",gap:"7px",marginBottom:"4px"}},
      h("span",{className:"net-sm",style:{background:card.color}},NET_ICONS[card.network]),
      h("span",{style:{fontWeight:700,fontSize:"12px",flex:1}},`${card.name} ${card.cardNum||"****"+card.last4}`),
      isSel?(isBest?h("span",{className:"badge badge-active"},"👑 Nên quẹt"):(isFull?(inNote?h("span",{className:"badge badge-warn"},"🔒 "+inNote):h("span",{className:"badge badge-warn"},"⚠ Full")):null))
           :h("span",{className:"badge badge-muted"},"＋ Chọn")),
    // Lý do được chọn: xếp hạng theo hạn mức CB CÒN LẠI, không theo rate — không nói ra thì
    // gợi ý "2% thắng 20%" trông như bug và mất tin cả tab.
    isBest?h("div",{className:"shop-detail",style:{color:"var(--accent)",fontWeight:700}},`👑 còn nhiều hạn mức nhất (${fmtTight(remCb)} CB)`):null,
    h("div",{className:"shop-detail"},`Hoàn ${fmtRate(er)} · max ${fmtK(emc)}`+(card.tierThreshold?(tierHi(card,ct)?" · bậc cao":" · bậc thấp"):"")),
    active&&!isFull?h("div",{className:"shop-detail"},`Còn `,h("strong",{style:{color:"var(--green)"}},fmtK(remS)),` → CB `,h("strong",{style:{color:"var(--green)"}},fmtK(remCb))):h("div",{className:"shop-detail",style:{color:"var(--warn)"}},inNote?`Kỳ này đang active "${inNote}"`:"Đã hết cashback kỳ này"),
    h("div",{className:"mini-bar"},h("div",{style:{height:"100%",borderRadius:"2px",width:pct+"%",background:isFull?"var(--warn)":card.color,transition:"width .3s"}})));
}

// ═══ CASHBACK HISTORY (GD tab → Lịch sử CB) ═══
// ═══ ICS / iPhone Calendar export (single events + per-event "đã thêm" flag) ═══
// Mỗi event có 1 key ổn định (auto: dueKey = cardId|date; thủ công: e.id). Đã add vào Lịch
// → key nằm trong state.calAdded (Y). Event add vào Lịch là ĐƠN LẺ, không lặp. Thẻ đổi/bị bỏ
// thì tháng sau không sinh nhắc mới → không trùng, không cần gỡ tay.
function _p2(n){return String(n).padStart(2,"0")}
function icsEsc(s){return String(s==null?"":s).replace(/([,;\\])/g,"\\$1").replace(/\r?\n/g,"\\n")}
function icsStamp(){const d=new Date();return d.getUTCFullYear()+_p2(d.getUTCMonth()+1)+_p2(d.getUTCDate())+"T"+_p2(d.getUTCHours())+_p2(d.getUTCMinutes())+_p2(d.getUTCSeconds())+"Z"}
function icsLocal(d,hh,mm){return d.getFullYear()+_p2(d.getMonth()+1)+_p2(d.getDate())+"T"+_p2(hh)+_p2(mm)+"00"}
function evKeyOf(e){return e.dueKey||e.id}
function isCalAdded(e){return (state.calAdded||[]).includes(evKeyOf(e))}
// All current events (auto within 14d + future manual), normalized, with .key/.isAuto
function allEvents(){
  const now=new Date(),nowStr=toLocalDateStr(now);
  const auto=getAutoEvents();
  const man=state.events.filter(e=>e.date>=nowStr).map(e=>({...e,isAuto:false,diff:Math.ceil((parseLocalDate(e.date)-now)/864e5)}));
  return [...auto,...man].map(e=>({...e,key:evKeyOf(e)})).sort((a,b)=>a.date.localeCompare(b.date));
}
function pendingCalEvents(){return allEvents().filter(e=>!isCalAdded(e))}
// Build a single-occurrence VCALENDAR from a list of normalized event objects
function buildICS(list){
  const ds=icsStamp();
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//CardTrack//VN//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:CardTrack"];
  list.forEach(e=>{
    const d=parseLocalDate(e.date),icon=e.isAuto?"💳 ":"🔔 ";
    L.push("BEGIN:VEVENT","UID:cardtrack-"+e.key.replace(/[^\w|-]/g,"")+"@cardtrack","DTSTAMP:"+ds,
      "DTSTART:"+icsLocal(d,9,0),"DTEND:"+icsLocal(d,9,30),
      "SUMMARY:"+icsEsc(icon+(e.title||"CardTrack")),
      "DESCRIPTION:"+icsEsc(e.sub||""),
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(e.title||"Nhắc"),"TRIGGER:-P1D","END:VALARM",
      "END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return L.join("\r\n");
}
// Trigger .ics download for `list`, then mark those keys as added
function downloadICS(list){
  if(!list.length){showToast("Không có event nào để thêm");return}
  try{
    const blob=new Blob([buildICS(list)],{type:"text/calendar;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download="cardtrack-events.ics";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    state.calAdded=[...new Set([...(state.calAdded||[]),...list.map(e=>e.key)])];
    persist();showToast(`📅 Đã tạo .ics (${list.length}) — mở bằng Safari để thêm vào Lịch`);
  }catch(err){showToast("⚠ Không tạo được file .ics")}
}

function openCalPicker(){const p=pendingCalEvents();setState({calPicker:true,calPick:p.map(e=>e.key)})}

function confirmCalPicker(){

// Build ONLY the cashback-feedback subtree (eq-hint + CB preview) for the txn form.
// Used both at first render and for live in-place updates while typing, so the
// amount/shop inputs are never destroyed mid-keystroke.
// Gợi ý cửa hàng: lọc theo chữ đang gõ (không phân biệt dấu/hoa-thường), tối đa 6.
function shopSuggestNodes(){
  const all=state.addCategory?(SHOP_SUGGESTIONS[state.addCategory]||[]):[];
  const norm=x=>String(x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d");
  const q=norm(state.addShop);
  const list=(q?all.filter(x=>norm(x).includes(q)):all).slice(0,6);
  if(!list.length)return [];
  return list.map(x=>h("button",{className:"chip"+(state.addShop===x?" sel":""),"data-shop":x,
    onClick:()=>{state.addShop=x;const inp=document.querySelector('[data-fid="add-shop"]');if(inp)inp.value=x;buzz(6);recalcTxnUI()}},x));
}
// Patch the txn form in place (no full re-render) — keeps keyboard focus & cursor intact.
function recalcTxnUI(){
  const fb=document.getElementById("txn-feedback");
  if(fb)fb.replaceWith(txnFeedbackNode());
  const pAmt=parseAmount(state.addAmount);
  const ec=document.getElementById("amt-echo");
  if(ec)ec.textContent=(state.addAmount&&pAmt>0)?`= ${fmt(pAmt)}${NBSP}₫`:"";
  const sb=document.getElementById("txn-submit");
  if(sb)sb.style.opacity=(state.addCardId&&state.addShop.trim()&&state.addAmount&&pAmt>0&&state.addCategory)?1:.4;
  const cw=document.getElementById("txn-chips");
  if(cw){cw.innerHTML="";shopSuggestNodes().forEach(n=>cw.appendChild(n))}
}

function hmRowBadge(card,ct,ts){
  const u=utilOf(card);
  if(u&&u.hot)return h("span",{className:"badge badge-warn hm-badge"},u.over?"⚠ Vượt hạn mức":"🔥 "+Math.round(u.pct)+"%");
  if(card.minSpend>0&&ts<card.minSpend)return h("span",{className:"badge badge-muted hm-badge"},"Chưa đạt min");
  if(card.tierThreshold&&!tierHi(card,ct))return h("span",{className:"badge badge-muted hm-badge"},"Chưa lên bậc");
  return null;
}
function hmCardRow(card){
  const ct=getCycleTxns(card),ts=ct.reduce((s,t)=>s+t.amount,0);
  const tc=calcTotalCb(card,ct),maxCb=maxCardCb(card);
  const pct=maxCb>0?Math.min(tc/maxCb*100,100):0;
  const dl=daysUntilDue(card);
  const badge=hmRowBadge(card,ct,ts);
  return h("button",{className:"row-btn hm-row",onClick:()=>setState({detailCardId:card.id})},
    h("div",{className:"stripe",style:{background:card.color}}),
    h("span",{className:"net-sm",style:{background:card.color}},NET_ICONS[card.network]),
    h("div",{className:"hm-mid"},
      h("div",{className:"hm-name-line"},
        h("span",{className:"hm-name"},`${card.name} •${card.last4||(card.cardNum||"").slice(-4)}`),
        badge),
      h("div",{className:"bar-track",role:"progressbar","aria-label":`Cashback ${card.name}`,"aria-valuenow":Math.round(tc),"aria-valuemin":0,"aria-valuemax":Math.round(maxCb)},
        h("div",{className:"bar-fill",style:{width:pct+"%",background:"var(--green)"}}))),
    h("div",{className:"hm-right"},
      h("div",{className:"hm-cb"},fmtTight(tc)),
      h("div",{className:"hm-due"+(dl!=null&&dl<=3?" warn":"")},dl!=null?`Hạn ${dl}d`:"—")));
}
function renderHomeTab(){
  const w=h("div",null);

    w.appendChild(h("div",{className:"es"},
      h("div",{className:"es-ic"},"💳"),

  rawCards.forEach(c=>{const t=getCycleTxns(c);sumSp+=t.reduce((s,x)=>s+x.amount,0);const cb=calcTotalCb(c,t);sumCb+=cb;const maxCb=maxCardCb(c);sumPot+=Math.max(maxCb-cb,0)});
  const heroPct=(sumCb+sumPot)>0?Math.min(sumCb/(sumCb+sumPot)*100,100):0;

      h("div",{style:{height:"100%",width:heroPct+"%",background:"var(--green)",borderRadius:"3px",transition:"width .5s cubic-bezier(.4,0,.2,1)"}})),
    h("div",{className:"hero-foot"},
      h("span",null,"Đã chi ",h("b",null,money(sumSp))),

  // ── First-run nudge: đã chọn thẻ nhưng chưa có giao dịch nào ──

    w.appendChild(h("div",{className:"es",style:{padding:"var(--s5) var(--s3)"}},
      h("div",{className:"es-ic"},"🧾"),
      h("div",{className:"es-t"},"Chưa có giao dịch nào"),
      h("div",{className:"es-s"},"Nhập giao dịch đầu tiên để app bắt đầu tính cashback, hạn mức và mốc chi tiêu tối thiểu."),
      h("button",{className:"es-btn",onClick:()=>setState({tab:"add",addMode:"txn",editTxnId:null,detailCardId:null})},"＋ Thêm giao dịch đầu tiên")));
  }

  // ── Alert stack: tối đa 3 cảnh báo tiền + tối đa 2 cảnh báo hạn mức nóng (≥80%), một khối duy nhất ──
  const alerts=cardAlerts(),hot=utilHotCards();
  if(alerts.length||hot.length){
    const shown=hmAlertsExpanded?alerts:alerts.slice(0,3);
    const ab=h("div",{className:"alert-box"});
    shown.forEach(a=>ab.appendChild(h("button",{className:"alert-row",style:{width:"100%",border:"none",background:"transparent"},onClick:()=>setState({detailCardId:a.card.id})},
      h("span",{className:"alert-ic"},a.type==="min"?"⚠️":"💸"),
      h("span",null,h("b",null,`${a.card.name} ${a.card.cardNum||"****"+a.card.last4}`),`: ${a.msg}`))));
    hot.slice(0,2).forEach(x=>ab.appendChild(h("button",{className:"hm-hotrow",onClick:()=>setState({detailCardId:x.card.id})},
      h("span",{className:"alert-ic"},"🔥"),
      h("span",null,h("b",null,x.card.name),`: đã dùng ${Math.round(x.u.pct)}% hạn mức`+(x.u.over?" — VƯỢT hạn mức":"")))));
    if(alerts.length>3)ab.appendChild(h("button",{className:"hm-more",onClick:()=>{hmAlertsExpanded=!hmAlertsExpanded;render()}},
      hmAlertsExpanded?"Thu gọn":`Xem tất cả ${alerts.length} cảnh báo`));
    w.appendChild(ab);
  }

  // ── Segmented sort + tìm thẻ (thu vào nút, chỉ mở khi cần — tránh chiếm chỗ danh sách) ──
  const segwrap=h("div",{className:"hm-segwrap"});
  const seg=h("div",{className:"seg"});
  [["bank","Theo ngân hàng"],["due","Sắp đến hạn"]].forEach(([k,l])=>seg.appendChild(h("button",{className:"seg-btn"+(state.cardSort===k?" on":""),onClick:()=>setState({cardSort:k})},l)));
  segwrap.appendChild(seg);
  segwrap.appendChild(h("button",{className:"hm-search-btn"+(hmSearchOpen?" on":""),"aria-label":"Tìm thẻ",onClick:()=>{hmSearchOpen=!hmSearchOpen;render()}},"🔍"));
  w.appendChild(segwrap);
  if(hmSearchOpen)w.appendChild(h("div",{className:"hm-search"},h("input",{className:"input","data-fid":"home-card-search",placeholder:"🔍  Tìm thẻ...",value:state.cardSearch,autofocus:true,
    onInput:e=>setState({cardSearch:e.target.value})})));

  // ── Danh sách thẻ thu gọn ──
  const q=(state.cardSearch||"").trim().toLowerCase();
  let cards=rawCards.filter(c=>!q||c.name.toLowerCase().includes(q)||bankKeyOf(c).toLowerCase().includes(q)||(c.last4||"").includes(q));
  cards=[...cards].sort((a,b)=>{
    if(state.cardSort==="due"){const da=daysUntilDue(a),db=daysUntilDue(b);
      if(da==null||db==null)return (da==null)-(db==null)||bankKeyOf(a).localeCompare(bankKeyOf(b));
      return da-db||bankKeyOf(a).localeCompare(bankKeyOf(b));}
    const ba=bankKeyOf(a),bb=bankKeyOf(b);
    if(ba!==bb)return ba.localeCompare(bb);
    return a.name.localeCompare(b.name,"vi");
  });
  if(!cards.length){w.appendChild(h("p",{className:"empty"},"// không tìm thấy thẻ"));return w}
  let lastBank="";
  cards.forEach(card=>{
    if(state.cardSort==="bank"){
      const bankName=bankKeyOf(card);
      if(bankName!==lastBank){lastBank=bankName;w.appendChild(h("div",{className:"hm-grp"},bankName))}
    }
    w.appendChild(hmCardRow(card));
  });
  return w;
}

function tx2Close(){tx2OpenId=null;tx2CbFormKey=null;tx2CbFormVal="";}

function tx2CurrentBranch(w,cards){
  const all=allTxns();
  const base=all.filter(tx=>(state.filterCard==="all"||tx.cardId===state.filterCard)&&tx.date.startsWith(state.filterMonth));

  // 3) Chip lĩnh vực — chỉ hiện lĩnh vực có mặt trong tập đang xem (base, trước khi lọc lĩnh vực)
  const catsPresent=[...new Set(base.map(t=>t.category))].sort((a,b)=>a.localeCompare(b,'vi'));
  if(state.filterCat!=="all"&&!catsPresent.includes(state.filterCat))state.filterCat="all";
  if(catsPresent.length>1){
    const cf=h("div",{className:"chip-row tx2-scrollx"});
    cf.appendChild(h("button",{className:"tx2-chip"+(state.filterCat==="all"?" sel":""),onClick:()=>{tx2Close();setState({filterCat:"all"})}},"Tất cả"));
    catsPresent.forEach(c=>cf.appendChild(h("button",{className:"tx2-chip"+(state.filterCat===c?" sel":""),onClick:()=>{tx2Close();setState({filterCat:c})}},(CAT_ICONS[c]||"")+" "+c)));
    w.appendChild(cf);
  }
  const filtered=base.filter(tx=>state.filterCat==="all"||tx.category===state.filterCat);

  if(!all.length){w.appendChild(tx2Empty("🧾","Chưa có giao dịch nào","Bấm ＋ ở thanh dưới để ghi giao dịch đầu tiên"));return}
  if(!filtered.length){
    w.appendChild(tx2Empty("🔎","Không có giao dịch khớp bộ lọc","Thử đổi thẻ, tháng hoặc lĩnh vực đang chọn",
      ()=>{tx2Close();setState({filterCard:"all",filterCat:"all"})}));
    return;
  }

  // 4) Summary bar — CB tính đúng theo kỳ của CHÍNH giao dịch (sửa lỗi CB=0 cho tháng cũ)
  let tSp=0,tCb=0;
  filtered.forEach(tx=>{tSp+=tx.amount;const c=ALL_CARDS.find(x=>x.id===tx.cardId);if(c)tCb+=calcTxnCb(tx,c,txCycleTxns(c,tx))});
  w.appendChild(h("div",{className:"summary-bar"},h("span",null,`Chi ${money(tSp)}`),h("span",{style:{color:"var(--green)",fontWeight:"800"}},`CB +${money(tCb)}`)));

  // 5) Danh sách nhóm theo ngày
  w.appendChild(txnListNode(filtered,{showCard:true,groupByDate:true,emptyText:"// chưa có giao dịch"}));
}
function txnListNode(txns,opts){
  const o=Object.assign({showCard:true,groupByDate:true,emptyText:"// chưa có giao dịch"},opts||{});
  const w=h("div",null);
  if(!txns||!txns.length){w.appendChild(h("p",{className:"empty"},o.emptyText));return w}
  const liveIds=new Set(state.transactions.map(t=>t.id));
  const sorted=[...txns].sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id)));
  let lastDate="";
  sorted.forEach(tx=>{
    if(o.groupByDate&&tx.date!==lastDate){lastDate=tx.date;w.appendChild(h("div",{className:"tx-date-head"},fmtDateVi(tx.date)))}
    w.appendChild(tx2Row(tx,o.showCard,liveIds.has(tx.id),!o.groupByDate));
  });
  return w;
}

// ═══ FRAGMENT: planner — tab "Nên quẹt" (4.14 Planner cả tháng, đa thẻ) ═══
// Sở hữu: renderAdviceTab + MỌI adv* (thay hàm cùng tên đã merge trước đó từ fragment "advice").
// Thêm segmented "1 giao dịch" | "Kế hoạch tháng" ở đầu tab. Nhánh "1 giao dịch" GIỮ NGUYÊN
// 100% logic/markup cũ (số tiền → chip lĩnh vực → đáp án 1 GD + tra shop). Nhánh mới "pl*".
//
// Hook cho fragment "points" (miles): advValueLine(card,cat,amt) — points có thể ĐỊNH NGHĨA LẠI
// hàm này (đè khi Opus ghép cả 2 fragment) để hiện thêm giá trị điểm/miles bên cạnh CB.
// Bản mặc định ở đây đã hoạt động được (dùng estTxnValue có sẵn) — không bắt buộc points phải đè.
//
// State MỚI: KHÔNG có — mọi input của Planner nằm ở biến module (_plMode, _plAmts), CHỦ Ý
// không lưu localStorage (kế hoạch là nội dung "nháp trong phiên", không phải dữ liệu sổ sách).
// Nếu Opus/PM muốn nhớ giữa các lần mở app thì cần thêm state key (vd state.plAmts) + persist()
// + export/importBackup — nói rõ ở đây để KHÔNG tự sửa persist().



// ── biến module (KHÔNG persist — xem chú thích đầu file) ──
let _plMode="txn";        // "txn" | "plan"
let _plAmts=null;         // {category:"chuỗi đang gõ"} — null = chưa khởi tạo lần nào
let _plTimer=null;        // debounce cho patch kết quả khi đang gõ

// Autofocus ô số tiền chỉ khi màn còn trống (chưa gõ gì) và không đang gõ ở input khác —
// tránh cướp focus giữa lúc người dùng đang gõ ô tìm shop.
function advMaybeAutoFocus(){
  if(state.advAmt)return;
  setTimeout(()=>{
    const el=document.getElementById("adv-amt-input");
    const af=document.activeElement;
    const afIsField=af&&(af.tagName==="INPUT"||af.tagName==="TEXTAREA");
    if(el&&!afIsField)el.focus();
  },0);
}

// Bỏ dấu tiếng Việt để tìm "sieu thi" ra "Siêu thị".
function advNorm(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}

function renderAdviceTab(){
  const w=h("div",null);
  const cards=selectedCards();
  if(!cards.length){
    w.appendChild(h("div",{className:"es"},h("div",{className:"es-ic"},"💳"),
      h("div",{className:"es-t"},"Chưa chọn thẻ nào"),
      h("div",{className:"es-s"},"Vào ⚙ ở header để chọn thẻ đang theo dõi")));
    return w;
  }

  // ── Segmented: tư vấn tức thời 1 giao dịch, hoặc lập kế hoạch cả tháng đa thẻ ──
  const seg=h("div",{className:"seg"});
  [["txn","1 giao dịch"],["plan","Kế hoạch tháng"]].forEach(([k,l])=>
    seg.appendChild(h("button",{className:"seg-btn"+(_plMode===k?" on":""),
      onClick:()=>{if(_plMode!==k){_plMode=k;render()}}},l)));
  w.appendChild(seg);

  if(_plMode==="plan"){w.appendChild(advPlanBranch(cards));return w}

  // ── 1. SỐ TIỀN TRƯỚC TIÊN ──
  const pAmt=parseAmount(state.advAmt),validAmt=!isNaN(pAmt)&&pAmt>0;
  const amtIn=h("input",{type:"text",inputmode:"decimal",className:"input input-amt",
    "data-fid":"adv-amt",id:"adv-amt-input",placeholder:"vd 500k, 2tr",autocomplete:"off",
    value:state.advAmt,onInput:e=>{setQ({advAmt:e.target.value});advRecalc()}});
  w.appendChild(h("div",{className:"fg"},h("label",{className:"lbl",htmlFor:"adv-amt-input"},"Định chi bao nhiêu?"),
    amtIn,h("div",{id:"adv-amt-echo",className:"amt-echo"},validAmt?`= ${fmt(pAmt)}${NBSP}₫`:"")));
  advMaybeAutoFocus();

  // ── 2. CHIP LĨNH VỰC — scroll ngang một hàng, chỉ lĩnh vực thẻ theo dõi thực có ──
  const cats=[...new Set(cards.flatMap(c=>c.cashbackCategories.map(x=>x.category)))].sort((a,b)=>a.localeCompare(b,'vi'));
  if(!cats.length){
    w.appendChild(h("p",{className:"empty"},"// các thẻ đang theo dõi chưa có lĩnh vực cashback nào"));
    return w;
  }
  if(!state.advCat||!cats.includes(state.advCat))state.advCat=cats[0];
  const cw=h("div",{className:"cat-filter scroll-x"});
  cats.forEach(c=>cw.appendChild(h("button",{className:"chip"+(state.advCat===c?" sel":""),
    onClick:()=>setState({advCat:c})},(CAT_ICONS[c]||"📦")+" "+c)));
  w.appendChild(cw);

  // ── 3. ĐÁP ÁN ──
  const rw=h("div",{id:"adv-result"});advRenderResult(rw);w.appendChild(rw);

  // ── 4. TRA SHOP ──
  w.appendChild(advShopSection());
  return w;
}

// Đệ quy tại chỗ khi gõ số tiền — patch #adv-amt-echo + #adv-result, KHÔNG setState (mất focus).
function advRecalc(){
  const pAmt=parseAmount(state.advAmt),validAmt=!isNaN(pAmt)&&pAmt>0;
  const ec=document.getElementById("adv-amt-echo");
  if(ec)ec.textContent=validAmt?`= ${fmt(pAmt)}${NBSP}₫`:"";
  const r=document.getElementById("adv-result");
  if(r){r.innerHTML="";advRenderResult(r)}
}

// ═══ 3. Đáp án: xếp hạng bằng estTxnCb + rankAdv (logic gốc từ renderAdviceResult cũ) ═══
function advRenderResult(el){
  const amt=parseAmount(state.advAmt),valid=!isNaN(amt)&&amt>0;
  // 5. Empty state khi chưa nhập số tiền.
  if(!valid){
    el.appendChild(h("div",{className:"es"},h("div",{className:"es-ic"},"⚡"),
      h("div",{className:"es-t"},"Nhập số tiền để xem gợi ý"),
      h("div",{className:"es-s"},"Chọn lĩnh vực + gõ số tiền dự tính — app xếp hạng thẻ nên quẹt ngay lập tức.")));
    return;
  }
  const cards=selectedCards().filter(c=>c.cashbackCategories.some(x=>x.category===state.advCat));
  if(!cards.length){el.appendChild(h("p",{className:"empty"},`// không thẻ nào có cashback cho "${state.advCat}"`));return}
  const scored=cards.map(c=>({c,e:estTxnCb(c,state.advCat,amt)})).sort((a,b)=>rankAdv(b.e)-rankAdv(a.e));
  const winner=scored[0],rest=scored.slice(1);
  const usable=winner.e.active&&!winner.e.belowMinTxn&&winner.e.remCap>0&&!winner.e.minNotMet&&winner.e.cb>0;
  el.appendChild(advWinnerNode(winner,rest,usable));
  if(rest.length)el.appendChild(advAltList(rest.slice(0,4)));
}

// Thẻ thắng — to, hero-num 34px mono green, kèm BẮT BUỘC dòng lý do.
function advWinnerNode(winner,rest,usable){
  const{c,e}=winner;
  const go=()=>{if(typeof buzz==="function")buzz();
    setState({tab:"add",addMode:"txn",editTxnId:null,addCardId:c.id,addCategory:state.advCat,addAmount:state.advAmt,addShop:""})};
  return h("button",{className:"hero adv-hero-btn",onClick:go,"aria-label":`Quẹt ${c.name} cho ${state.advCat}`},
    h("div",{className:"hero-lbl"},"👑 Nên quẹt"),
    h("div",{style:{display:"flex",alignItems:"center",gap:"8px",marginTop:"4px"}},
      h("span",{className:"net-sm",style:{background:c.color}},NET_ICONS[c.network]),
      h("span",{style:{fontWeight:800,fontSize:"15px",color:"var(--text)"}},`${c.name} ${c.cardNum||"****"+c.last4}`)),
    h("div",{className:"hero-num",style:usable?null:{color:"var(--warn)"}},(usable?"+":"")+fmt(e.cb)+NBSP+"₫"),
    h("div",{className:"adv-reason",style:{color:usable?"var(--accent)":"var(--warn)"}},advWinReason(winner,rest,usable)),
    h("div",{className:"adv-sub"},`Hoàn ${fmtRate(e.rate)} · trần ${fmtK(e.maxCb!=null?e.maxCb:e.def.maxCashback)}${e.remCap>0?" · còn "+fmtTight(e.remCap)+" CB":""}`));
}

// Dòng lý do thẻ thắng — vì sao nó thắng, hoặc vì sao bị loại nếu không dùng được.
// Đây là điểm sửa bug cũ: vương miện rơi vào thẻ rate thấp mà không giải thích trông như bug.
function advWinReason(winner,rest,usable){
  const{c,e}=winner;
  if(!usable){
    if(e.lockCat&&!e.active)return `🔒 kỳ này đang khoá lĩnh vực "${e.lockCat}" (thẻ chỉ tính 1 lĩnh vực/kỳ)`;
    if(e.belowMinTxn)return `⚠ giao dịch cần tối thiểu ${fmtK(c.minTxnAmount)} để được tính CB`;
    if(e.remCap<=0)return `⚠ đã hết hạn mức cashback kỳ này`;
    if(e.minNotMet)return `⚠ chưa đạt tối thiểu chi tiêu — còn thiếu ${fmtK(e.minRemain)}`;
    return `⚠ chưa có cashback nào phù hợp lúc này`;
  }
  const betterRate=rest.find(o=>o.e.active&&o.e.rate>e.rate);
  if(!betterRate)return `còn nhiều hạn mức nhất · rate ${fmtRate(e.rate)} cũng cao nhất trong các thẻ theo dõi`;
  if(betterRate.e.minNotMet&&!e.minNotMet)return `đã đạt tối thiểu chi tiêu — ${betterRate.c.name} chưa đạt (rate ${fmtRate(betterRate.e.rate)} cao hơn nhưng chưa dùng được)`;
  if(!betterRate.e.active||betterRate.e.remCap<=0)return `${betterRate.c.name} (rate ${fmtRate(betterRate.e.rate)}) đã hết hạn mức cashback kỳ này`;
  if(betterRate.e.remCap<e.remCap)return `còn nhiều hạn mức hơn (${fmtTight(e.remCap)} so với ${fmtTight(betterRate.e.remCap)} của ${betterRate.c.name} — rate ${fmtRate(betterRate.e.rate)} cao hơn nhưng gần full)`;
  return `cho CB ước tính cao nhất trong số thẻ theo dõi cho giao dịch này`;
}

// 2-4 thẻ xếp sau — gọn hơn, có nêu rõ lý do bị loại (minNotMet/belowMinTxn/lockCat/remCap=0).
function advAltList(list){
  const w=h("div",{className:"adv-alts"});
  w.appendChild(h("div",{className:"lbl",style:{marginTop:"16px"}},"Thẻ khác"));
  list.forEach(({c,e})=>{
    const usable=e.active&&!e.belowMinTxn&&e.remCap>0&&!e.minNotMet&&e.cb>0;
    let flag=null;
    if(e.lockCat&&!e.active)flag=`🔒 khoá "${e.lockCat}"`;
    else if(e.belowMinTxn)flag=`⚠ cần ≥${fmtK(c.minTxnAmount)}`;
    else if(e.remCap<=0)flag="⚠ hết hạn mức CB";
    else if(e.minNotMet)flag=`⚠ thiếu ${fmtK(e.minRemain)}`;
    w.appendChild(h("button",{className:"adv-alt",onClick:()=>{if(typeof buzz==="function")buzz();
        setState({tab:"add",addMode:"txn",editTxnId:null,addCardId:c.id,addCategory:state.advCat,addAmount:state.advAmt,addShop:""})}},
      h("span",{className:"net-sm",style:{background:c.color}},NET_ICONS[c.network]),
      h("span",{className:"adv-alt-name"},`${c.name} ${c.cardNum||"****"+c.last4}`),
      usable?h("span",{className:"adv-alt-cb"},`+${fmtK(e.cb)}${NBSP}₫`):h("span",{className:"adv-alt-flag"},flag||"—")));
  });
  return w;
}

// ═══ 4. Tra shop — mặc định KHÔNG render danh sách (điểm cốt tử sửa 44.215px cũ) ═══
function advShopSection(){

// Danh sách shop — CHỈ render khi query ≥2 ký tự HOẶC filter lĩnh vực ≠ all. Giới hạn 12 shop.
function advRenderShopList(el){
  const q=advNorm(state.shopSearch.trim());
  if(q.length<2&&state.shopCatFilter==="all"){
    el.appendChild(h("p",{className:"adv-shop-hint"},"Gõ ≥2 ký tự hoặc chọn lĩnh vực ở trên để tra shop cụ thể."));
    return;
  }
  const selIds=state.selectedCardIds;
  const filtered=SHOP_CARD_MAP.filter(s=>state.shopCatFilter==="all"||s.category===state.shopCatFilter)
    .filter(s=>!q||advNorm(s.shop).includes(q)||advNorm(s.category).includes(q))
    .map(s=>({...s,cardIds:s.cardIds.filter(id=>ALL_CARDS.some(c=>c.id===id))})).filter(s=>s.cardIds.length>0)
    .sort((a,b)=>a.shop.localeCompare(b.shop,'vi'));
  if(!filtered.length){el.appendChild(h("p",{className:"empty"},"// không tìm thấy shop"));return}
  const shown=filtered.slice(0,12);
  shown.forEach(s=>{
    const se=h("div",{className:"shop-card"},h("div",{className:"shop-head"},
      h("span",{className:"shop-icon"},CAT_ICONS[s.category]||"📦"),
      h("div",null,h("div",{className:"shop-name"},s.shop),h("div",{className:"shop-cat"},s.category))));
    // Một shop có thể map sang lĩnh vực khác nhau tuỳ thẻ (vd Shopee → "Online Shopee/Tiktok" của BIDV-1768).
    const catOf=cid=>(s.cardCats&&s.cardCats[cid])||s.category;
    const sel=s.cardIds.filter(id=>selIds.includes(id)).sort((a,b)=>shopRemCb(b,catOf(b))-shopRemCb(a,catOf(a)));
    const oth=s.cardIds.filter(id=>!selIds.includes(id)).sort((a,b)=>shopRemCb(b,catOf(b))-shopRemCb(a,catOf(a)));
    const bestId=sel.find(cid=>shopUsable(cid,catOf(cid)))||null;
    if(!sel.length)se.appendChild(h("div",{className:"shop-sub-divider"},"Gợi ý · chưa chọn thẻ nào"));
    sel.forEach(cid=>{const r=renderShopRec(cid,catOf(cid),true,cid===bestId,s.shop);if(r)se.appendChild(r)});
    if(oth.length&&sel.length)se.appendChild(h("div",{className:"shop-sub-divider"},"Thẻ khác · chạm để chọn"));
    oth.forEach(cid=>{const r=renderShopRec(cid,catOf(cid),false,false,s.shop);if(r)se.appendChild(r)});
    el.appendChild(se);
  });
  if(filtered.length>shown.length)el.appendChild(h("p",{className:"adv-cut"},`Đang hiện ${shown.length}/${filtered.length} shop — gõ cụ thể hơn để thu hẹp.`));
}

// Bài toán: "tháng này tôi dự chi X ở các lĩnh vực này, nên chia lên thẻ nào để tổng CB lớn nhất?"
// — có xét cả 6 thẻ yêu cầu min-spend (Shinhan×2 3tr, MSB Online×2 3tr, CIMB 3tr, LPB 8tr)
// và 3 thẻ nhảy bậc ở 10tr (HDB EZ Speed, VIB Online Plus×2).

// Hook cho fragment "points": trả về node nhỏ (hoặc null) hiện thêm giá trị điểm/miles của
// (thẻ, lĩnh vực, số tiền). Bản mặc định dùng estTxnValue có sẵn — points có thể đè lại hàm
// này để làm UI phong phú hơn, miễn giữ đúng chữ ký advValueLine(card,cat,amt).
function advValueLine(card,cat,amt){
  if(typeof pointRateOf!=="function"||typeof estTxnValue!=="function")return null;
  const pr=pointRateOf(card);
  if(!pr)return null;
  const v=estTxnValue(card,cat,amt,false);
  if(!v||!v.points||!v.points.pts)return null;
  return h("span",{className:"adv-pts"},`+${fmt(v.points.pts)}${NBSP}${v.points.unit}`);
}

// Khoá DOM an toàn từ tên lĩnh vực tiếng Việt (cho data-fid).
function plSafeKey(cat){return advNorm(cat).replace(/[^a-z0-9]+/g,"-")}

// Lĩnh vực mà bất kỳ thẻ nào trong `cards` có cashback (giống hệt cats ở nhánh "1 giao dịch").
function plCatsOf(cards){
  return [...new Set(cards.flatMap(c=>c.cashbackCategories.map(x=>x.category)))].sort((a,b)=>a.localeCompare(b,'vi'));
}

// Mặc định điền sẵn = chi tiêu THÁNG TRƯỚC (tháng lịch) của chính lĩnh vực đó, gộp mọi thẻ.
// Dùng allTxns() (kỳ hiện tại + kho lưu trữ) lọc theo monthKey THÁNG TRƯỚC.
function plAmtsInit(cats){
  const now=new Date();
  const pmk=monthKey(new Date(now.getFullYear(),now.getMonth()-1,1));
  const o={};
  cats.forEach(cat=>{
    const sum=allTxns().filter(t=>t.category===cat&&(t.date||"").slice(0,7)===pmk)
      .reduce((s,t)=>s+t.amount,0);
    o[cat]=sum>0?String(Math.round(sum)):"";
  });
  return o;
}

// Patch tại chỗ khi gõ số tiền (debounce 220ms) — không setState/render để không mất focus ô đang gõ.

// ── 2. Cắt số tiền mỗi lĩnh vực thành các "lát" để phân bổ dần ──
// Kích lát ~ 1/20 số tiền, kẹp [100K, 500K]. Nếu tổng lát toàn kế hoạch > CAP_TOTAL (200) thì
// co giãn kích lát lên đều cho mọi lĩnh vực để không treo UI (báo `capped=true` cho UI biết).
function plBuildSlices(amtsMap){
  const CAP_TOTAL=200;
  const entries=Object.entries(amtsMap).filter(([,v])=>v>0);
  if(!entries.length)return{slices:[],capped:false};
  let plan=entries.map(([cat,amt])=>{
    const size=Math.max(100000,Math.min(500000,amt/20));
    return{cat,amt,n:Math.max(1,Math.round(amt/size))};
  });
  let total=plan.reduce((s,p)=>s+p.n,0);
  let capped=false;
  if(total>CAP_TOTAL){
    capped=true;
    const scale=CAP_TOTAL/total;
    plan=plan.map(p=>({...p,n:Math.max(1,Math.round(p.n*scale))}));
    total=plan.reduce((s,p)=>s+p.n,0);
    // Làm tròn có thể vẫn nhích quá CAP_TOTAL — cắt bớt 1 lát của lĩnh vực đang có nhiều lát nhất.
    let guard=0;
    while(total>CAP_TOTAL&&guard++<64){
      const maxP=plan.reduce((a,b)=>b.n>a.n?b:a);
      if(maxP.n<=1)break;
      maxP.n--;total--;
    }
  }
  const slices=[];
  plan.forEach(p=>{
    const base=Math.floor(p.amt/p.n);
    let used=0;
    for(let k=0;k<p.n;k++){
      // Lát cuối gánh phần dư (làm tròn) để tổng các lát luôn khớp tuyệt đối với số tiền nhập.
      const a=(k===p.n-1)?(p.amt-used):base;
      used+=a;
      if(a>0)slices.push({cat:p.cat,amount:a});
    }
  });
  return{slices,capped};
}

// ── 3. Greedy: mỗi lát gán cho thẻ có CB BIÊN cao nhất tại thời điểm đó ──
// CB biên = calcTotalCb(card, GD_thực + GD_giả_đã_gán + lát_mới) − calcTotalCb(card, GD_thực + GD_giả_đã_gán).
// Cách này tự động tôn trọng cap riêng/max chung/tier/min-spend/khoá lĩnh vực (firstCatOnly) vì
// calcTotalCb đã bao hàm tất cả — không cần mô phỏng lại công thức tiền.
function plGreedyAllocate(cards,slices){
  const real={};cards.forEach(c=>{real[c.id]=getCycleTxns(c)});
  const fake={};cards.forEach(c=>{fake[c.id]=[]});
  let seq=0;
  // Ưu tiên lát lớn trước: quyết định min-spend/tier ổn định hơn khi vùng chọn còn nhiều dư địa.
  const ordered=[...slices].sort((a,b)=>b.amount-a.amount);
  ordered.forEach(sl=>{
    const eligible=cards.filter(c=>c.cashbackCategories.some(x=>x.category===sl.cat));
    if(!eligible.length)return;
    let best=null,bestMarg=-Infinity;
    eligible.forEach(c=>{
      const ctBefore=[...real[c.id],...fake[c.id]];
      const txn={id:"pl-"+(seq++),cardId:c.id,category:sl.cat,amount:sl.amount,date:toLocalDateStr(new Date())};
      const before=calcTotalCb(c,ctBefore);
      const after=calcTotalCb(c,[...ctBefore,txn]);
      const marg=after-before;
      if(marg>bestMarg){bestMarg=marg;best={c,txn}}
    });
    if(best)fake[best.c.id].push(best.txn);
  });
  return{real,fake};
}

// ── 4. Sau khi hết lát: "mở khoá" min-spend / tier bằng cách dồn lát từ thẻ khác sang ──
// Đây là bước quan trọng nhất — greedy từng lát riêng lẻ dễ bỏ sót LPB (min 8tr, thường không
// thắng CB biên ở các lát nhỏ đầu tiên) và 3 thẻ tier 10tr (chỉ đáng nếu gom đủ CẢ NGƯỠNG).
// Với mỗi thẻ có minSpend/tierThreshold chưa đạt: tìm lát đang gán cho thẻ KHÁC nhưng cùng
// lĩnh vực thẻ này cũng theo dõi, gom đủ phần thiếu, rồi so TỔNG CB toàn kế hoạch trước/sau khi
// chuyển — chỉ áp dụng nếu tổng CB tăng (tự động bù được cả phần CB thẻ nguồn bị mất).
function plPostOptimize(cards,real,fake){
  cards.forEach(target=>{
    const thresholds=[];
    if(target.minSpend>0)thresholds.push(target.minSpend);
    if(target.tierThreshold)thresholds.push(target.tierThreshold);
    if(!thresholds.length)return;
    const targetCats=target.cashbackCategories.map(x=>x.category);
    thresholds.forEach(need=>{
      const spendNow=cycleSpendTotal(target,[...real[target.id],...fake[target.id]]);
      if(spendNow>=need)return;   // đã đạt ngưỡng này rồi, không cần làm gì
      const gap=need-spendNow;
      // Ứng viên nguồn: lát giả đang nằm ở THẺ KHÁC, cùng lĩnh vực target cũng theo dõi.
      let candidates=[];
      cards.forEach(src=>{
        if(src.id===target.id)return;
        fake[src.id].forEach(tx=>{if(targetCats.includes(tx.category))candidates.push({src,tx})});
      });
      if(!candidates.length)return;
      // Tổn thất khi rút 1 lát khỏi nguồn = CB nguồn giảm bao nhiêu — rút lát tổn thất THẤP nhất trước.
      candidates.forEach(cd=>{
        const full=[...real[cd.src.id],...fake[cd.src.id]];
        const without=full.filter(t=>t!==cd.tx);
        cd.loss=calcTotalCb(cd.src,full)-calcTotalCb(cd.src,without);
      });
      candidates.sort((a,b)=>a.loss-b.loss);
      let moved=0;const chosen=[];
      for(const cd of candidates){if(moved>=gap)break;chosen.push(cd);moved+=cd.tx.amount}
      if(moved<=0)return;
      // So TỔNG CB toàn kế hoạch trước/sau khi thử chuyển — chỉ áp dụng nếu thực sự lợi.
      // QUAN TRỌNG: các lát được chọn có thể thuộc NHIỀU lĩnh vực khác nhau (miễn là target cũng
      // theo dõi lĩnh vực đó) — phải chuyển TỪNG lát sang target và GIỮ NGUYÊN lĩnh vực gốc của nó,
      // không gộp thành 1 giao dịch duy nhất (gộp sẽ gán nhầm cả cục tiền vào 1 lĩnh vực và làm
      // con số "chi ở lĩnh vực X" phình to hơn số tiền người dùng thực sự nhập cho lĩnh vực đó).
      const beforeTotal=cards.reduce((s,c)=>s+calcTotalCb(c,[...real[c.id],...fake[c.id]]),0);
      const trialFake={};cards.forEach(c=>{trialFake[c.id]=[...fake[c.id]]});
      chosen.forEach(cd=>{
        trialFake[cd.src.id]=trialFake[cd.src.id].filter(t=>t!==cd.tx);
        trialFake[target.id]=[...trialFake[target.id],{...cd.tx,id:"pl-mv-"+cd.tx.id,cardId:target.id}];
      });
      const afterTotal=cards.reduce((s,c)=>s+calcTotalCb(c,[...real[c.id],...trialFake[c.id]]),0);
      if(afterTotal>beforeTotal){
        cards.forEach(c=>{fake[c.id]=trialFake[c.id]});   // lợi → áp dụng
      }
    });
  });
}

// Nếu dồn HẾT các lĩnh vực đã nhập vào MỘT thẻ tốt nhất — để so sánh giá trị của việc chia thẻ.
function plSingleCardBest(cards,amtsMap){
  let best=0,bestCard=null;
  const entries=Object.entries(amtsMap);
  cards.forEach(c=>{
    const real=getCycleTxns(c);
    const fakeTx=entries.map(([cat,amt],i)=>({id:"pl-single-"+i,cardId:c.id,category:cat,amount:amt,date:toLocalDateStr(new Date())}));
    const cb=calcTotalCb(c,[...real,...fakeTx])-calcTotalCb(c,real);
    if(cb>best){best=cb;bestCard=c}
  });
  return{cb:best,card:bestCard};
}

// ── Tổng hợp: chạy đủ 4 bước + đo thời gian (performance.now()) ──
function plCompute(usableCards,amtsMap){
  const t0=(typeof performance!=="undefined"?performance.now():Date.now());
  const{slices,capped}=plBuildSlices(amtsMap);
  const{real,fake}=plGreedyAllocate(usableCards,slices);
  plPostOptimize(usableCards,real,fake);
  const perCard=usableCards.map(c=>{
    const assigned=fake[c.id];
    if(!assigned.length)return null;
    const byCat={};assigned.forEach(tx=>{byCat[tx.category]=(byCat[tx.category]||0)+tx.amount});
    const ctAll=[...real[c.id],...assigned];
    const baseline=calcTotalCb(c,real[c.id]);
    const cb=calcTotalCb(c,ctAll)-baseline;
    const spendTotal=cycleSpendTotal(c,ctAll);
    const minGap=c.minSpend>0&&spendTotal<c.minSpend?c.minSpend-spendTotal:0;
    const tierGap=c.tierThreshold&&spendTotal<c.tierThreshold?c.tierThreshold-spendTotal:0;
    return{card:c,byCat,cb,minGap,tierGap};
  }).filter(Boolean).sort((a,b)=>b.cb-a.cb);
  const totalCb=perCard.reduce((s,p)=>s+p.cb,0);
  const single=plSingleCardBest(usableCards,amtsMap);
  const elapsed=(typeof performance!=="undefined"?performance.now():Date.now())-t0;
  return{perCard,totalCb,single,capped,totalSlices:slices.length,elapsed};
}

function plCompareLine(res){
  if(!res.single||!res.single.card)return null;
  if(res.totalCb>res.single.cb+1){
    return h("div",{className:"hero-pot"},
      `nếu dồn hết vào 1 thẻ tốt nhất (${res.single.card.name}) chỉ được ${money(res.single.cb)} — `,
      h("span",{style:{color:"var(--green)",fontWeight:700}},`chia thẻ lợi hơn +${money(res.totalCb-res.single.cb)}`));
  }
  return h("div",{className:"hero-pot"},`tương đương dồn hết vào 1 thẻ (${res.single.card.name})`);
}

function plCardBlock(p){
  const w=h("div",{className:"panel pl-cardblk"});
  w.appendChild(h("div",{className:"pl-cardhead"},
    h("span",{className:"net-sm",style:{background:p.card.color}},NET_ICONS[p.card.network]),
    h("span",{className:"pl-cardname"},`${p.card.name} ${p.card.cardNum||"****"+p.card.last4}`),
    h("span",{className:"pl-cardcb"},"+"+fmt(p.cb)+NBSP+"₫")));
  const badges=[];
  if(p.minGap>0)badges.push(h("span",{className:"badge badge-warn"},`cần chi thêm ${fmtK(p.minGap)} để đạt tối thiểu`));
  if(p.tierGap>0)badges.push(h("span",{className:"badge badge-warn"},`cần thêm ${fmtK(p.tierGap)} để lên bậc cao`));
  if(badges.length)w.appendChild(h("div",{className:"pl-badges"},...badges));
  Object.entries(p.byCat).forEach(([cat,amt])=>{
    w.appendChild(h("button",{className:"row-btn",onClick:()=>{if(typeof buzz==="function")buzz();
        setState({tab:"add",addMode:"txn",editTxnId:null,addCardId:p.card.id,addCategory:cat,addAmount:String(amt),addShop:""})}},
      h("span",{className:"pl-catgo-lbl"},(CAT_ICONS[cat]||"📦")+" "+cat),
      h("span",{className:"pl-catgo-amt"},money(amt)),
      advValueLine(p.card,cat,amt)));
  });
  return w;
}

function plResultNode(res){
  const w=h("div",null);
  w.appendChild(h("div",{className:"hero"},
    h("div",{className:"hero-lbl"},"Tổng cashback dự kiến"),
    h("div",{className:"hero-num"},"+"+fmt(res.totalCb)+NBSP+"₫"),
    plCompareLine(res)));
  if(res.capped)w.appendChild(h("p",{className:"adv-cut"},
    `⚠ Đã gộp lát chi tiêu để giới hạn ở ${res.totalSlices} phần tính toán (tránh treo máy) — kết quả có thể chưa tối ưu tuyệt đối.`));
  if(!res.perCard.length){
    w.appendChild(h("p",{className:"empty"},"// chưa thẻ nào theo dõi khớp lĩnh vực đã nhập"));
    return w;
  }
  w.appendChild(h("div",{className:"lbl",style:{marginTop:"18px"}},"Chia theo thẻ"));
  res.perCard.forEach(p=>w.appendChild(plCardBlock(p)));
  return w;
}

// ═══ FRAGMENT: recon — CB về kỳ sau (4.4) + Đối chiếu + PTN tự điền (4.7) ═══
// Sở hữu: renderTxnTab · tx2HistoryBranch · tx2HistRow · tx2VarianceTag · tx2CbForm
// KHÔNG chạm: tx2Row / tx2ActionRow / txnListNode / tx2CurrentBranch / tx2Empty / tx2Close
// (các hàm đó ở nguyên trong bản nền / do fragment `txnadv` sở hữu — chỉ GỌI, không định nghĩa lại).
//
// Thêm mới (tiền tố rc* để không đụng ai):
//   rcCreditState(card,key)     — {pay,actual,days,pending,late} cho 1 kỳ của 1 thẻ, dùng chung
//                                  bởi nhánh Lịch sử CB + màn Đối chiếu.
//   rcHistorySummary(rows)      — khối .hero đầu nhánh "Lịch sử CB": tổng CB đang chờ ghi có
//                                  (số lớn nhất), tổng đã nhận + số kỳ quá hạn ở hero-foot.
//   tx2ReconBranch(w)           — nhánh mới state.txnView==="recon", dựng từ cbPipeline().
//   rcReconRow(x)               — 1 dòng trong bảng đối chiếu: thẻ+kỳ, ước tính, ô nhập thực
//                                  nhận, chênh lệch, nút "Điền nhanh: bằng ước tính".
//   reconAfAutoNode(card)       — 4.7: so sánh afSpentTotal (tay) vs afSpendFromTxns (tự tính) +
//                                  nút tự điền. XUẤT RA để Opus nối vào renderPTNDetail (xem cuối).
//
// Quyết định thiết kế:
//  - Bộ lọc tháng (filterMonth) vẫn CHỈ áp dụng cho nhánh "Giao dịch" — cả "Lịch sử CB" và
//    "Đối chiếu" đều nhóm theo thời gian riêng của chúng (tháng của ngày GD gốc / tháng ghi có
//    dự kiến), nên ô tháng bị làm mờ + disabled ở cả hai state còn lại.
//  - "Đối chiếu" đọc từ cbPipeline() (đã tính pending/late theo cbPostOf/cbPostDate) — KHÔNG tự
//    tính lại ngày ghi có, để nếu Opus/agent khác đổi công thức cbPostDate thì màn này tự đúng.
//  - rcCreditState tính pending/late giống công thức trong cbPipeline() nhưng áp được cho MỌI
//    dòng của state.history (kể cả kỳ đã ngoài phạm vi recentCycles(_,4) hoặc thẻ đã bỏ theo dõi
//    — orphan thì không có `card` nên không tính được, giữ nguyên hành vi cũ).


// ── 4.4 · trạng thái ghi có của 1 kỳ CB (dùng ở cả Lịch sử CB + Đối chiếu) ──
function rcCreditState(card,key){
  const today=new Date();today.setHours(0,0,0,0);
  const pay=cbPostDate(card,key);
  const actual=cbActualOf(card,key);
  const days=Math.round((pay-today)/864e5);
  return{pay,actual,days,pending:actual==null&&days>=0,late:actual==null&&days<0};
}

// Khối tóm tắt đầu nhánh "Lịch sử CB": tổng CB đang chờ ghi có = số lớn nhất của nhánh này.
function rcHistorySummary(rows){
  let awaiting=0,received=0,lateCount=0,haveAny=false;
  rows.forEach(x=>{
    const card=!x.orphan&&ALL_CARDS.find(c=>c.id===x.cardId);
    if(!card)return;
    haveAny=true;
    const key=x.cycleStart;
    const haveLive=cycleTxnsByKey(card,key).length>0;
    const est=haveLive?cbVariance(card,key).est:(x.cb||0);
    const cs=rcCreditState(card,key);
    if(cs.actual!=null)received+=cs.actual;
    else{awaiting+=est;if(cs.late)lateCount++}
  });
  if(!haveAny)return null;
  return h("div",{className:"hero"},
    h("div",{className:"hero-lbl"},"CB đang chờ ghi có"),
    h("div",{className:"hero-num"},fmt(awaiting)+NBSP+"₫"),
    lateCount>0
      ?h("div",{className:"hero-pot",style:{color:"var(--warn)"}},`⚠ ${lateCount} kỳ quá hạn ghi có — ngân hàng lẽ ra đã trả`)
      :h("div",{className:"hero-pot",style:{color:"var(--text3)"}},"✓ chưa có kỳ quá hạn"),
    h("div",{className:"hero-foot"},
      h("span",null,"Đã nhận ",h("b",null,money(received))),
      h("span",null,h("b",{style:{color:lateCount>0?"var(--warn)":"var(--text)"}},lateCount)," kỳ quá hạn")));
}

function renderTxnTab(){
  const w=h("div",null),cards=selectedCards();

  // 1) Filter row — thẻ + tháng. Nguồn dữ liệu là allTxns() (kỳ hiện tại + kho lưu trữ) nên
  // xem được cả tháng đã qua kỳ sao kê, không chỉ state.transactions.
  const selC=h("select",{"aria-label":"Lọc theo thẻ",style:{flex:"1",minWidth:"0"},
    onChange:e=>{tx2Close();setState({filterCard:e.target.value})}});
  selC.appendChild(h("option",{value:"all"},"Tất cả thẻ"));
  cards.forEach(c=>selC.appendChild(h("option",{value:c.id},`${c.name} ${c.cardNum||"****"+c.last4}`)));
  selC.value=state.filterCard;
  const dimMonth=state.txnView!=="current";
  const mIn=h("input",{type:"month","aria-label":"Lọc theo tháng",className:"month-in"+(dimMonth?" tx2-dim":""),
    disabled:dimMonth,onChange:e=>{tx2Close();setState({filterMonth:e.target.value})}});
  mIn.value=state.filterMonth;
  w.appendChild(h("div",{className:"filter-row"},selC,mIn));
  if(state.txnView==="history")w.appendChild(h("div",{className:"field-hint",style:{margin:"-6px 0 10px"}},"Lịch sử CB xem theo mọi tháng — bộ lọc tháng không áp dụng ở đây"));
  if(state.txnView==="recon")w.appendChild(h("div",{className:"field-hint",style:{margin:"-6px 0 10px"}},"Đối chiếu nhóm theo tháng ghi có dự kiến — bộ lọc tháng không áp dụng ở đây"));

  // 2) Segmented Giao dịch / Lịch sử CB / Đối chiếu
  const seg=h("div",{className:"seg"});
  [["current","Giao dịch"],["history","Lịch sử CB"],["recon","Đối chiếu"]].forEach(([k,l])=>
    seg.appendChild(h("button",{className:"seg-btn"+(state.txnView===k?" on":""),onClick:()=>{tx2Close();setState({txnView:k})}},l)));
  w.appendChild(seg);

  if(state.txnView==="history"){tx2HistoryBranch(w);return w}
  if(state.txnView==="recon"){tx2ReconBranch(w);return w}
  tx2CurrentBranch(w,cards);return w;
}

function tx2HistoryBranch(w){
  const hist=state.history||[];
  if(!hist.length){w.appendChild(tx2Empty("📊","Chưa có lịch sử CB","Tự lưu khi giao dịch qua kỳ sao kê mới"));return}
  const rows=hist.filter(x=>state.filterCard==="all"||x.cardId===state.filterCard);
  if(!rows.length){
    w.appendChild(tx2Empty("🔎","Không có lịch sử khớp thẻ đang chọn","Thử chọn lại thẻ ở bộ lọc phía trên",
      ()=>{tx2Close();setState({filterCard:"all"})}));
    return;
  }

  // ── 4.4: khối tóm tắt trạng thái ghi có — số lớn nhất của nhánh này ──
  const summaryNode=rcHistorySummary(rows);
  if(summaryNode)w.appendChild(summaryNode);

  // Summary bar: chi + CB — ưu tiên hiện CB THỰC NHẬN nếu đã nhập đủ, không thì hiện ước tính
  let tSp=0,tCbEst=0,tCbAct=0,anyAct=false;
  rows.forEach(x=>{
    tSp+=x.spend;
    const card=!x.orphan&&ALL_CARDS.find(c=>c.id===x.cardId);
    // Ưu tiên tính lại "sống" từ cycleTxnsByKey (đúng khi công thức CB đổi sau này); nếu GD của
    // kỳ đó đã bị dọn khỏi kho lưu trữ (quá ARCHIVE_MONTHS) thì rơi về số đã chốt lúc lưu (x.cb).
    const haveLive=card&&cycleTxnsByKey(card,x.cycleStart).length>0;
    const v=haveLive?cbVariance(card,x.cycleStart):null;
    tCbEst+=haveLive?v.est:(x.cb||0);
    const actual=card?cbActualOf(card,x.cycleStart):null;
    if(actual!=null){tCbAct+=actual;anyAct=true}
  });
  w.appendChild(h("div",{className:"summary-bar"},h("span",null,`Chi ${money(tSp)}`),
    h("span",{style:{color:"var(--green)",fontWeight:"800"}},anyAct?`CB thực +${money(tCbAct)}`:`CB ước tính +${money(tCbEst)}`)));

  const byMonth={};
  rows.forEach(x=>{(byMonth[x.month]=byMonth[x.month]||[]).push(x)});
  Object.keys(byMonth).sort((a,b)=>b.localeCompare(a)).forEach(m=>{
    const [yy,mm]=m.split("-");
    w.appendChild(h("div",{className:"hist-month"},`Tháng ${+mm}/${yy}`));
    byMonth[m].sort((a,b)=>b.cb-a.cb).forEach(x=>w.appendChild(tx2HistRow(x)));
  });
}
function tx2HistRow(x){
  const card=!x.orphan&&ALL_CARDS.find(c=>c.id===x.cardId);
  const key=x.cycleStart;
  // haveLive=false khi GD của kỳ này đã bị dọn khỏi kho lưu trữ (>ARCHIVE_MONTHS) — lúc đó
  // không tin số tính lại (sẽ ra 0), dùng số đã chốt lúc lưu (x.cb) và không so sánh chênh lệch
  // (không có gì để so, tránh hiện "chênh lệch" giả khi mẫu số thật ra là dữ liệu đã mất).
  const haveLive=card&&cycleTxnsByKey(card,key).length>0;
  const v=haveLive?cbVariance(card,key):null;
  const est=haveLive?v.est:(x.cb||0);
  // ── 4.4: trạng thái ghi có — ⏳ dự kiến / ⚠ quá hạn / ✓ đã nhận ──
  const cs=card?rcCreditState(card,key):null;
  const rowKey=x.cardId+"|"+key;
  const open=tx2CbFormKey===rowKey;
  const wrap=h("div",{className:"tx2-hrow"});

  let statusNode=null;
  if(card&&cs){
    if(cs.actual!=null){
      statusNode=haveLive
        ?tx2VarianceTag(v)
        :h("div",{className:"rc-status rc-received"},"✓ đã nhận "+fmtK(cs.actual));
    }else if(cs.late){
      statusNode=h("div",{className:"rc-status rc-late"},`⚠ quá hạn ghi có ${-cs.days}${NBSP}ngày`);
    }else{
      statusNode=h("div",{className:"rc-status rc-pending"},`⏳ dự kiến về ${fmtDateVi(toLocalDateStr(cs.pay))} · còn ${cs.days}${NBSP}ngày`);
    }
  }
  const askBtn=(card&&cs&&cs.actual==null)
    ?h("button",{className:"tx2-cbask",onClick:()=>{tx2CbFormKey=open?null:rowKey;tx2CbFormVal="";render()}},open?"✕ đóng":"＋ nhập CB thực nhận")
    :null;

  wrap.appendChild(h("div",{className:"hist-row"},
    h("div",{style:{minWidth:0}},
      h("div",{style:{fontWeight:700,fontSize:"14px",display:"flex",alignItems:"center",gap:"5px",flexWrap:"wrap"}},
        `${x.cardName} ••${x.last4}`,
        x.orphan?h("span",{className:"badge badge-muted"},"đã bỏ theo dõi"):null),
      h("div",{style:{fontSize:"var(--t-meta)",color:"var(--text3)"}},`Kỳ ${fmtDateVi(x.cycleStart)} · ${x.count} GD`)),
    h("div",{style:{textAlign:"right",flexShrink:0}},
      h("div",{className:"mono",style:{fontWeight:800}},money(x.spend)),
      h("div",{className:"mono",style:{fontSize:"13px",color:"var(--green)"}},"CB ước tính "+fmtK(est)),
      statusNode,
      askBtn)));
  if(open&&card)wrap.appendChild(tx2CbForm(card,key));
  return wrap;
}
function tx2VarianceTag(v){
  const pos=v.diff>=0;
  return h("div",{className:"rc-status rc-received"},
    "✓ đã nhận "+fmtK(v.actual),
    h("span",{className:"rc-diff-chip",style:{color:pos?"var(--green)":"var(--warn)"}},`(${pos?"+":""}${fmtK(v.diff)})`));
}
function tx2CbForm(card,key){
  return h("div",{className:"panel tx2-cbform"},
    h("label",{className:"lbl",htmlFor:"tx2-cbin"},`CB thực nhận — ${card.name} ${card.cardNum||"****"+card.last4}`),
    h("div",{className:"fg-row"},
      h("input",{className:"input",id:"tx2-cbin","data-fid":"tx2-cbin",type:"text",inputmode:"decimal",placeholder:"vd 250k",value:tx2CbFormVal,
        onInput:e=>{tx2CbFormVal=e.target.value}}),
      h("button",{className:"submit",style:{background:"var(--accent2)",width:"auto"},onClick:()=>{
        const amt=parseAmount(tx2CbFormVal);
        setCbActual(card.id,key,isNaN(amt)?null:amt);
        tx2CbFormKey=null;tx2CbFormVal="";buzz(10);showToast("✓ Đã lưu CB thực nhận");render();
      }},"Lưu")));
}

// ═══ Nhánh "Đối chiếu" (state.txnView==="recon") ═══
// Buffer nhập tay theo "cardId|cycleKey" đang gõ trong bảng đối chiếu — KHÔNG persist,
// tương tự tx2CbFormVal ở nhánh Lịch sử CB.
const rcDraft={};
function rcRowKey(card,key){return card.id+"|"+key}

function tx2ReconBranch(w){
  const pipe=cbPipeline();
  if(!pipe.length){
    w.appendChild(tx2Empty("🧮","Chưa có CB nào để đối chiếu","CB xuất hiện ở đây sau khi một kỳ sao kê có cashback đã chốt"));
    return;
  }
  const rows=pipe.filter(x=>state.filterCard==="all"||x.card.id===state.filterCard);
  if(!rows.length){
    w.appendChild(tx2Empty("🔎","Không có khoản nào khớp thẻ đang chọn","Thử chọn lại thẻ ở bộ lọc phía trên",
      ()=>{tx2Close();setState({filterCard:"all"})}));
    return;
  }

  // ── Hero: tổng CB còn phải đối chiếu (chưa nhập thực nhận) — số lớn nhất của màn này ──
  let pendingEst=0,doneCount=0,lateCount=0;
  rows.forEach(x=>{
    if(x.actual!=null)doneCount++;else{pendingEst+=x.est;if(x.late)lateCount++}
  });
  w.appendChild(h("div",{className:"hero"},
    h("div",{className:"hero-lbl"},"Đang chờ đối chiếu"),
    h("div",{className:"hero-num"},fmt(pendingEst)+NBSP+"₫"),
    h("div",{className:"hero-pot",style:{color:lateCount>0?"var(--warn)":"var(--text3)"}},
      lateCount>0?`⚠ ${lateCount} kỳ đã quá hạn ghi có`:"chưa có kỳ quá hạn"),
    h("div",{className:"hero-foot"},
      h("span",null,h("b",null,doneCount),`/${rows.length} kỳ đã đối chiếu`),
      h("span",null,"Ước tính tổng ",h("b",null,money(rows.reduce((s,x)=>s+x.est,0)))))));

  const byMonth={};
  rows.forEach(x=>{const mk=toLocalDateStr(x.payDate).slice(0,7);(byMonth[mk]=byMonth[mk]||[]).push(x)});
  Object.keys(byMonth).sort().forEach(mk=>{
    const [yy,mm]=mk.split("-");
    w.appendChild(h("div",{className:"hist-month"},`Ghi có dự kiến tháng ${+mm}/${yy}`));
    byMonth[mk].forEach(x=>w.appendChild(rcReconRow(x)));
  });
}

// 1 dòng đối chiếu: thẻ + kỳ + ước tính + ô nhập thực nhận + chênh lệch + "Điền nhanh".
function rcReconRow(x){
  const rk=rcRowKey(x.card,x.key);
  const draft=rcDraft[rk];
  const curVal=draft!==undefined?draft:(x.actual!=null?String(x.actual):"");
  const draftAmt=draft!==undefined?parseAmount(draft):NaN;
  const liveActual=draft!==undefined?(isNaN(draftAmt)?null:draftAmt):x.actual;
  const diff=liveActual!=null?liveActual-x.est:null;

  let statusTxt,statusColor;
  if(x.actual!=null){statusTxt="✓ đã đối chiếu";statusColor="var(--green)"}
  else if(x.late){statusTxt=`⚠ quá hạn ${-x.days}${NBSP}ngày`;statusColor="var(--warn)"}
  else{statusTxt=`⏳ còn ${x.days}${NBSP}ngày`;statusColor="var(--text2)"}

  const commit=v=>{
    const amt=parseAmount(v);
    setCbActual(x.card.id,x.key,isNaN(amt)?null:amt);
    delete rcDraft[rk];buzz(10);showToast("✓ Đã lưu CB thực nhận");render();
  };

  return h("div",{className:"rc-row"},
    h("div",{className:"rc-row-head"},
      h("span",{className:"net-sm",style:{background:x.card.color}},NET_ICONS[x.card.network]),
      h("div",{className:"rc-row-mid"},
        h("div",{className:"rc-row-name"},`${x.card.name} ••${x.card.last4}`),
        h("div",{className:"rc-row-sub"},`Kỳ ${x.label} · về ${fmtDateVi(toLocalDateStr(x.payDate))}`)),
      h("span",{className:"rc-row-status",style:{color:statusColor}},statusTxt)),
    h("div",{className:"rc-est-line"},"Ước tính CB: ",h("b",{className:"mono",style:{color:"var(--text)"}},money(x.est))),
    h("input",{className:"input rc-inp",type:"text",inputmode:"decimal",placeholder:"Nhập CB thực nhận trên sao kê",
      "aria-label":`CB thực nhận ${x.card.name} kỳ ${x.label}`,
      "data-fid":"rc-inp-"+rk,value:curVal,
      onInput:e=>{rcDraft[rk]=e.target.value;render()},
      onChange:e=>commit(e.target.value)}),
    h("div",{className:"rc-row-foot"},
      diff!=null
        ?h("span",{className:"rc-diff",style:{color:diff>=0?"var(--green)":"var(--warn)"}},`Chênh lệch ${diff>=0?"+":""}${fmtK(diff)}`)
        :h("span",{className:"rc-diff-empty"},"chưa có số để so"),
      h("button",{className:"rc-fillbtn",onClick:()=>commit(String(x.est))},"Điền nhanh: bằng ước tính")));
}

// ═══ 4.7 · Tự điền chi tiêu miễn PTN từ giao dịch đã có ═══
// Export để Opus nối vào renderPTNDetail(c) — xem ghi chú cuối file trả lời.
function reconAfAutoNode(card){
  const manual=afSpentTotal(card);
  const cycleKeys=new Set(afCycles(card).map(c=>c.key));
  const auto=afSpendFromTxns(card);
  const autoTotal=Object.entries(auto).filter(([k])=>cycleKeys.has(k)).reduce((s,[,v])=>s+v,0);
  const wrap=h("div",{className:"panel rc-af-panel"});
  wrap.appendChild(h("div",{className:"rc-af-head"},"🔁 Tự điền từ giao dịch"));
  wrap.appendChild(h("div",{className:"rc-af-compare"},
    h("div",{className:"rc-af-line"},"Đang nhập tay: ",h("b",null,money(manual))),
    h("div",{className:"rc-af-line"},"Tính từ giao dịch đã ghi trong app: ",h("b",null,money(autoTotal)))));
  wrap.appendChild(h("div",{className:"field-hint"},"App chỉ biết những giao dịch bạn đã nhập trong CardTrack — số tự tính có thể THẤP HƠN thực tế bạn đã chi ở ngân hàng nếu bạn ghi thiếu giao dịch."));
  wrap.appendChild(h("button",{className:"submit rc-af-btn",style:{background:"var(--accent2)"},onClick:()=>{
    askConfirm({title:"Tự điền chi tiêu miễn PTN?",
      body:`Sẽ GHI ĐÈ các ô chi tiêu theo tháng của ${card.name} ${card.cardNum||"****"+card.last4} bằng số tính từ giao dịch đã nhập (tổng ${money(autoTotal)}).\n\nÔ nào bạn đã nhập tay khác với số này cũng sẽ bị thay thế.`,
      okLabel:"Ghi đè bằng số tự tính",danger:false,
      onOk:()=>{
        const n=applyAfAuto(card.id);
        buzz(10);showToast(n>0?`✓ Đã tự điền ${n} kỳ`:"— Không có kỳ nào cần cập nhật");render();
      }});
  }},"⟳ Tự điền từ giao dịch"));
  return wrap;
}

/*@FRAG:txnadv*/
// Mã tiền thường gặp trong GD của người dùng VN. Người dùng có thể tự nhập mã khác qua "Khác…".
const TXA_FX_CURS=["USD","EUR","JPY","SGD","THB","KRW","CNY","AUD"];

// ── State transient của form Thêm GD (không lưu localStorage — reset khi lưu/huỷ) ──
let _txaRefund=false;                              // đang ở chế độ "Hoàn tiền"?
let _txaFxOpen=false;                               // disclosure "Giao dịch ngoại tệ" đang mở?
let _txaFx={cur:"",curCustom:"",orig:"",rate:""};   // input thô của khối FX (string, chưa parse)
let _txaEditSyncId;                                 // editTxnId đã đồng bộ vào state trên — tránh sync lại mỗi lần render

// Đồng bộ _txaRefund/_txaFx với GD đang sửa (editTxn() ở nền chỉ set addAmount/addCategory/...,
// không biết về cờ hoàn tiền/FX của fragment này) — chạy 1 lần mỗi khi editTxnId đổi.
function txaSyncEdit(){
  if(state.editTxnId===_txaEditSyncId)return;
  _txaEditSyncId=state.editTxnId;
  if(!state.editTxnId){_txaRefund=false;_txaFxOpen=false;_txaFx={cur:"",curCustom:"",orig:"",rate:""};return}
  const tx=(state.transactions||[]).find(t=>t.id===state.editTxnId)||(state.txnArchive||[]).find(t=>t.id===state.editTxnId);
  if(!tx)return;
  _txaRefund=isRefund(tx);
  // editTxn() (nền) gán addAmount=String(tx.amount) — với hoàn tiền đó là số ÂM, nhưng ô nhập
  // luôn hiện số dương (nhãn đổi thành "Số tiền hoàn"), nên chuẩn hoá lại về trị tuyệt đối.
  if(_txaRefund)state.addAmount=String(Math.abs(tx.amount));
  if(tx.fx&&tx.fx.cur){
    const known=TXA_FX_CURS.includes(tx.fx.cur);
    _txaFxOpen=true;
    _txaFx={cur:known?tx.fx.cur:"other",curCustom:known?"":tx.fx.cur,orig:String(tx.fx.orig),rate:String(tx.fx.rate)};
  }else{
    _txaFxOpen=false;_txaFx={cur:"",curCustom:"",orig:"",rate:""};
  }
}
function txaResetForm(){
  _txaRefund=false;_txaFxOpen=false;_txaFx={cur:"",curCustom:"",orig:"",rate:""};_txaEditSyncId=state.editTxnId;
}

// Số gốc hiển thị gọn (120.5 chứ không phải 120,5 hay 120.500000001)
function txaFmtOrig(v){
  const n=+v;
  if(!isFinite(n))return "";
  return String(Math.round(n*1e6)/1e6);
}
function txaCurLabel(){return _txaFx.cur==="other"?(_txaFx.curCustom||"?").trim().toUpperCase()||"?":_txaFx.cur}
// Chữ luôn dùng sans (--font-body); chỉ số/tiền mới dùng mono (.mono có sẵn ở nền) — bọc riêng
// để không lỡ áp font-mono lên cả câu tiếng Việt (dấu bị vẽ lệch trong font đếm ký tự).
function txaMono(t){return h("span",{className:"mono"},t)}

// Tính quy đổi FX sống từ _txaFx (chưa lưu) — null nếu chưa đủ dữ liệu hợp lệ
function txaFxCalc(selCard){
  const rawCur=_txaFx.cur==="other"?_txaFx.curCustom:_txaFx.cur;
  const cur=String(rawCur||"").trim().toUpperCase();
  const orig=parseAmount(_txaFx.orig);
  const rate=parseAmount(_txaFx.rate);
  if(!cur||!(orig>0)||!(rate>0))return null;
  const vnd=Math.round(orig*rate);
  const feeRate=selCard?fxFeeOf(selCard):FX_FEE_DEFAULT;
  const fee=Math.round(vnd*feeRate);
  return{cur,orig,rate,vnd,feeRate,fee,total:vnd+fee};
}
// tx.fx để lưu khi submit — giữ nguyên miễn còn hợp lệ, bất kể ô VND có bị user sửa tay sau đó không
function txaBuildFx(){
  if(!_txaFxOpen)return null;
  const c=txaFxCalc(null);
  if(!c)return null;
  return{cur:c.cur,orig:c.orig,rate:c.rate};
}

function txaFxSummaryNode(selCard){
  const c=txaFxCalc(selCard);
  const inner=!c
    ? h("div",{className:"field-hint"},"Nhập đủ mã tiền, số gốc và tỷ giá để tự tính số tiền VND.")
    : h("div",null,
        h("div",{className:"txa-fx-line"},
          txaMono(`${txaFmtOrig(c.orig)}${NBSP}${c.cur}`)," × ",txaMono(fmt(c.rate))," = ",txaMono(fmt(c.vnd)+NBSP+"₫")),
        h("div",{className:"txa-fx-line txa-fx-sub"},
          "phí FX ",txaMono(fmtRate(c.feeRate))," ≈ ",txaMono(fmt(c.fee)+NBSP+"₫")," · tổng ≈ ",txaMono(fmt(c.total)+NBSP+"₫")),
        h("div",{className:"field-hint"},"Phí FX chỉnh trong Cài đặt."));
  return h("div",{id:"txa-fx-summary",className:"txa-fx-summary"},inner);
}
// Patch tại chỗ khi user gõ mã tiền tự nhập / số gốc / tỷ giá — giữ focus, không render() toàn trang.
function txaRecalcFx(){
  const selCard=ALL_CARDS.find(c=>c.id===state.addCardId);
  const c=txaFxCalc(selCard);
  if(c){
    state.addAmount=String(c.vnd);
    const amtInput=document.getElementById("add-amt-input");
    if(amtInput)amtInput.value=String(c.vnd);
  }
  const sumEl=document.getElementById("txa-fx-summary");
  if(sumEl)sumEl.replaceWith(txaFxSummaryNode(selCard));
  txaRecalc();
}
// Đổi mã tiền qua <select> làm hiện/ẩn ô "tự nhập" → cần dựng lại cả khối, nên render() toàn trang.
function txaOnCurChange(v){
  _txaFx.cur=v;
  const selCard=ALL_CARDS.find(c=>c.id===state.addCardId);
  const c=txaFxCalc(selCard);
  if(c)state.addAmount=String(c.vnd);
  buzz(6);render();
}

// Gợi ý cửa hàng cho form Thêm GD — bản riêng của fragment này (không gọi shopSuggestNodes/recalcTxnUI
// của nền vì hai hàm đó không biết cập nhật khối hoàn tiền/FX mới thêm).
function txaShopChips(){
  const all=state.addCategory?(SHOP_SUGGESTIONS[state.addCategory]||[]):[];
  const norm=x=>String(x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d");
  const q=norm(state.addShop);
  const list=(q?all.filter(x=>norm(x).includes(q)):all).slice(0,6);
  if(!list.length)return [];
  return list.map(x=>h("button",{className:"chip"+(state.addShop===x?" sel":""),"data-shop":x,
    onClick:()=>{state.addShop=x;const inp=document.querySelector('[data-fid="add-shop"]');if(inp)inp.value=x;buzz(6);txaRecalc()}},x));

// Patch tại chỗ (echo số tiền + khối CB/hoàn tiền + độ mờ nút Lưu + chip gợi ý cửa hàng) khi đang gõ.
function txaRecalc(){
  const fb=document.getElementById("txn-feedback");
  if(fb)fb.replaceWith(txnFeedbackNode());

  const ec=document.getElementById("amt-echo");
  if(ec){
    ec.style.color=_txaRefund?"var(--warn)":"";

  }

  if(sb)sb.style.opacity=(state.addCardId&&state.addShop.trim()&&state.addAmount&&pAmt>0&&state.addCategory)?1:.4;

// Build ONLY the cashback-feedback subtree (eq-hint + CB preview, hoặc cảnh báo hoàn tiền) cho form.
// Dùng cả ở lần render đầu và khi patch tại chỗ trong lúc gõ, nên input không bị hủy giữa lúc gõ.
function txnFeedbackNode(){
  const selCard=ALL_CARDS.find(c=>c.id===state.addCardId);
  const fb=h("div",{id:"txn-feedback"});
  if(!selCard)return fb;
  const pAmt=parseAmount(state.addAmount);
  if(!(state.addAmount&&pAmt>0&&state.addCategory))return fb;
  if(_txaRefund)return txaRefundFeedback(fb,selCard,pAmt);
  // Dùng CHUNG estTxnCb với tab Tư vấn — trước đây form Thêm có bộ estimate riêng
  // (không cap luỹ kế, không cảnh báo min-spend) nên hai chỗ báo hai số khác nhau.
  const e=estTxnCb(selCard,state.addCategory,pAmt);
  const warn=t=>fb.appendChild(h("div",{className:"no-cb",style:{marginBottom:"12px"}},t));
  if(!e.has){
    fb.appendChild(h("div",{className:"cb-preview",style:{background:"var(--bg3)",borderColor:"var(--border)"}},
      `CB: `,h("strong",{style:{color:"var(--text3)"}},"0"+NBSP+"₫"),
      h("span",{style:{marginLeft:"8px",fontSize:"12px",color:"var(--text3)"}},`thẻ này không hoàn "${state.addCategory}"`)));
    return fb;
  }
  if(!e.active&&e.lockCat)return warn(`⚠ Kỳ này thẻ đang khoá lĩnh vực "${e.lockCat}" → "${state.addCategory}" không được hoàn`),fb;
  if(e.belowMinTxn)return warn(`⚠ Giao dịch dưới ${fmtK(selCard.minTxnAmount)} không được hoàn (thẻ này yêu cầu ≥ ${fmtK(selCard.minTxnAmount)})`),fb;
  if(e.remCap<=0)return warn(`⚠ "${state.addCategory}" đã kín hạn mức cashback kỳ này — chi thêm không được hoàn`),fb;
  const box=h("div",{className:"cb-preview"},`CB ước tính: `,
    h("strong",{style:{color:"var(--green)"}},money(e.cb)),
    h("span",{style:{marginLeft:"8px",fontSize:"12px",color:"var(--text3)"}},`còn ${fmtTight(e.remCap)} hạn mức`));
  fb.appendChild(box);
  if(e.minNotMet)warn(`⚠ Kỳ này còn thiếu ${fmtTight(e.minRemain-pAmt>0?e.minRemain-pAmt:0)} để đạt tối thiểu ${fmtK(selCard.minSpend)} — chưa đạt thì ngân hàng KHÔNG hoàn`);
  return fb;
}
// Khối cảnh báo TRUNG TÍNH khi đang ở chế độ hoàn tiền: hoàn tiền không "được CB", nó THU HỒI CB
// đã tính của lĩnh vực đó — không dùng --green (đó là "tiền nhận thêm").
function txaRefundFeedback(fb,selCard,pAmt){
  const ct0=getCycleTxns(selCard).filter(t=>t.id!==state.editTxnId);
  const fakeTx={id:"txa-refund-preview",cardId:selCard.id,category:state.addCategory,amount:-pAmt,
    date:state.addDate||toLocalDateStr(new Date())};
  const delta=calcTxnCb(fakeTx,selCard,ct0);
  const clawback=Math.max(-delta,0);
  fb.appendChild(h("div",{className:"txa-refund-box"},
    h("div",null,"↩ Hoàn tiền sẽ ",h("strong",null,"TRỪ lại")," cashback đã tính của lĩnh vực này."),
    clawback>0
      ? h("span",{className:"txa-refund-amt"},"Thu hồi ước tính: − ",txaMono(money(clawback)))
      : h("span",{style:{color:"var(--text3)",fontSize:"12px",marginTop:"4px",display:"block"}},"Lĩnh vực này chưa nhận CB nên không có gì bị thu hồi.")));
  return fb;
}

  txaSyncEdit();

    h("div",{id:"amt-echo",className:"amt-echo",style:{color:_txaRefund?"var(--warn)":""}},

  cards.forEach(c=>cs.appendChild(h("option",{value:c.id},`${c.name} ${c.cardNum||"****"+c.last4}`)));cs.value=state.addCardId;
  w.appendChild(h("div",{className:"fg"},h("label",{className:"lbl",htmlFor:"add-card-sel"},"Thẻ"),cs));

  // ── 3. LĨNH VỰC ──
  const catS=h("select",{id:"add-cat-sel",onChange:e=>setState({addCategory:e.target.value,addShop:""})});
  if(selCard){

    catS.appendChild(h("option",{value:"",disabled:"true"},"───── Khác ─────"));
    CATEGORIES.filter(c=>!selCard.cashbackCategories.find(cb=>cb.category===c)).forEach(c=>catS.appendChild(h("option",{value:c},`${CAT_ICONS[c]||""} ${c}`)));

  w.appendChild(cg);

  // ── 4. CỬA HÀNG: gợi ý LỌC THEO CHỮ ĐANG GÕ, tối đa 6 — không còn 27 chip tĩnh ──

  w.appendChild(h("button",{className:"submit",id:"txn-submit",style:{background:"var(--accent2)",opacity:canS?1:.4},onClick:()=>{
    clearTimeout(_addInputTimer);
    // Re-check with LIVE state values
    const amt=parseAmount(state.addAmount);
    const liveCanS=state.addCardId&&state.addShop.trim()&&state.addAmount&&amt>0&&state.addCategory;
    if(!liveCanS)return;if(isNaN(amt)||amt<=0)return;
    // Ngày mới có còn nằm trong kỳ hiện tại của thẻ không? Nếu không, GD sẽ bị chuyển vào
    // kho lưu trữ ở lần render kế tiếp — phải nói trước, trước đây nó âm thầm biến mất.
